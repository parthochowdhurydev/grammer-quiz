a past verb and an unclear ‘they’.","bn":"(C)-তে সবকিছু স্পষ্ট: ‘his answers’ এবং past tense-এর সাথে ‘would’। (A) ও (D)-তে ‘it’ কাকে বোঝায় তা পরিষ্কার নয়; (B)-তে past verb-এর পরে ‘will’ বসেছে এবং ‘they’ অস্পষ্ট।","stem":"The defendant refused to answer the prosecutor's questions _____.","opts":["because he was afraid it would incriminate him","for fear that they will incriminate him","because he was afraid that his answers would incriminate him","fearing that he will be incriminated by it"],"kind":"structure","note":"PDF-এর উত্তর-কী-তে (D) লেখা ছিল, কিন্তু PDF-এর নিজের ব্যাখ্যাতেও (C)-কে সঠিক বলা হয়েছে। সঠিক উত্তর (C)।"},{"id":"4-2","t":4,"n":2,"type":"mcq","ans":"D","fix":"","en":"A sentence beginning with ‘Only + adverbial’ takes inverted order (‘will Mr. Forbes be able’). (A) and (B) have no ‘only’, so they cannot cause inversion; (C) is wrong because ‘hardly’ means ‘almost not’ — it should be ‘hard’.","bn":"‘Only’ দিয়ে শুরু হলে পরে inversion (will + subject) হয়। (A) ও (B)-তে only নেই; (C)-তে ‘hardly’ মানে ‘প্রায় না’, এখানে ‘hard’ হওয়া উচিত ছিল।","stem":"_____will Mr. Forbes be able to regain control of the company.","opts":["With hard work","In spite of his hard work","Only if he works hardly","Only with hard work"],"kind":"structure"},{"id":"4-3","t":4,"n":3,"type":"mcq","ans":"D","fix":"","en":"‘Return’ already means ‘give back’, so ‘back’ in (A) is redundant; the direct object must come before the ‘to’ phrase, so (B) is wrong; (C) uses the adverb ‘originally’ where an adjective is needed.","bn":"‘Return’ মানেই ফেরত দেওয়া, তাই (A)-তে ‘back’ বাড়তি; direct object (the wallet) আগে বসে, তাই (B) ভুল; noun-এর আগে adverb ‘originally’ নয়, adjective ‘original’ লাগে, তাই (C) ভুল।","stem":"Mrs. Walker has returned _____.","opts":["a wallet back to its original owner","to its original owner the wallet","the wallet to its originally owner","the wallet to its original owner"],"kind":"structure"},{"id":"4-4","t":4,"n":4,"type":"mcq","ans":"A","fix":"","en":"‘Owe’ takes an indirect object + a direct object with no preposition: ‘owes the government twenty million dollars’. After a number, ‘million’ has no -s, so (D) is wrong.","bn":"‘Owe’-এর গঠন: owe + ব্যক্তি + পরিমাণ, মাঝে কোনো preposition লাগে না। সংখ্যার পরে ‘million’-এ -s হয় না, তাই (D) ভুল।","stem":"The hospital owes _____for the construction of the new wing.","opts":["the government twenty million dollars","for the government twenty million dollars","to the government twenty million dollars","twenty millions of dollars to the government"],"kind":"structure"},{"id":"4-5","t":4,"n":5,"type":"mcq","ans":"C","fix":"","en":"‘Tell’ takes the person directly: ‘told her professors’. ‘Said’ would need ‘to’ (B); ‘told to’ is wrong (A); the present continuous (D) does not fit with ‘could’.","bn":"‘Tell’-এর পরে সরাসরি ব্যক্তি বসে: ‘told her professors’। ‘said’-এর পরে ‘to’ লাগত (B); ‘told to’ ভুল (A); ‘could’-এর সাথে present continuous মেলে না (D)।","stem":"Maria _____that she could not attend classes next week.","opts":["told to her professors","said her professors","told her professors","is telling her professors"],"kind":"structure"},{"id":"4-6","t":4,"n":6,"type":"mcq","ans":"B","fix":"","en":"The person who was asked to speak (Dr. Casagrande) must be the subject right after the participial phrase; otherwise the participle dangles.","bn":"‘Having been asked to speak’ — যিনি আমন্ত্রণ পেয়েছেন (Dr. Casagrande) তাঁকেই কমার পরে subject হিসেবে বসাতে হবে; নাহলে dangling participle হয়।","stem":"Having been asked to speak at the convention, _____.","opts":["some notes were prepared for Dr. Casagrande","Dr. Casagrande prepared some notes","the convention members were pleased to hear Dr. Casagrande","some notes were prepared by Dr. Casagrande"],"kind":"structure"},{"id":"4-7","t":4,"n":7,"type":"mcq","ans":"B","fix":"","en":"‘Never before’ at the start causes inversion and supplies the auxiliary ‘have’ that ‘been’ needs: ‘Never before have so many people been …’.","bn":"‘Never before’ দিয়ে শুরু হলে inversion হয় এবং ‘been’-এর জন্য auxiliary ‘have’ লাগে: ‘Never before have so many people been …’।","stem":"_____so many people been out of work as today.","opts":["More than ever before","Never before have","In the past, there never have","Formerly, there never were"],"kind":"structure"},{"id":"4-8","t":4,"n":8,"type":"mcq","ans":"D","fix":"","en":"(D) is a complete, correct clause. (A) uses ‘good’ instead of the adverb ‘well’; (B) and (C) use ‘they / their’ with no clear antecedent, and (C) also has ‘an good’.","bn":"(D) সম্পূর্ণ শুদ্ধ clause। (A)-তে adverb ‘well’-এর জায়গায় ‘good’; (B) ও (C)-তে ‘they / their’ কাদের বোঝায় স্পষ্ট নয়, আর (C)-তে ‘an good’ ভুল।","stem":"The artist was asked to show some paintings at the contest because_____.","opts":["he painted very good","they believed he painted well","of their belief that he was an good artist","the judges had been told of his talents"],"kind":"structure"},{"id":"4-9","t":4,"n":9,"type":"mcq","ans":"A","fix":"","en":"The subject after the comma must clearly name the people who finished lunch: ‘the detectives’. (B) is passive (a dangling participle), (C)'s ‘they’ has no antecedent, and (D) uses slang (‘a bunch of’).","bn":"কমার পরে যারা লাঞ্চ শেষ করেছে তাদের স্পষ্টভাবে subject হিসেবে বসাতে হবে: ‘the detectives’। (B) passive (dangling), (C)-র ‘they’ কাদের বোঝায় অস্পষ্ট, (D)-তে অপভাষা ‘a bunch of’।","stem":"Having finished lunch, _____.","opts":["the detectives began to discuss the case","the case was discussed again by the detectives","they discussed the case","a bunch of detectives discussed the case"],"kind":"structure","note":"PDF-এ উত্তর (C) দেওয়া ছিল। কিন্তু (C)-এর ‘they’ কাকে বোঝায় তা বাক্যে নেই (প্রশ্ন ১-এ এই কারণেই ‘it’ বাদ পড়েছে), তাই (A) বেশি নির্ভুল।"},{"id":"4-10","t":4,"n":10,"type":"mcq","ans":"B","fix":"","en":"‘Offer’ takes an indirect object + a direct object with no preposition: ‘offered Mr. Armstrong the position’ (or ‘offered the position to Mr. Armstrong’).","bn":"‘Offer’-এর গঠন: offer + ব্যক্তি + জিনিস, মাঝে preposition লাগে না: ‘offered Mr. Armstrong the position’।","stem":"Mrs. Sierra offered _____because she had faith in his capabilities.","opts":["to Mr. Armstrong the position","Mr. Armstrong the position","the position for Mr. Armstrong","Mr. Armstrong to the position"],"kind":"structure"},{"id":"4-11","t":4,"n":11,"type":"mcq","ans":"A","fix":"","en":"‘Only because …’ at the start causes the inversion ‘did Jerome accept’. Without ‘only’ ((B), (D)) there is no inversion; (C) wrongly uses ‘interested’ for ‘interesting’.","bn":"‘Only because …’ দিয়ে শুরু হওয়ায় পরে inversion (did Jerome accept) হয়েছে। (B) ও (D)-তে only নেই; (C)-তে ‘interesting’-এর বদলে ‘interested’ ভুল।","stem":"_____did Jerome accept the job.","opts":["Only because it was interesting work","Because it was interesting work","Only because it was interested work","The work was interesting"],"kind":"structure"},{"id":"4-12","t":4,"n":12,"type":"mcq","ans":"B","fix":"","en":"(B) is concise and correct (‘The screaming burn victims’). (A) is wordy and repetitive, (C) uses wrong forms, and (D) adds a second verb.","bn":"(B) সংক্ষিপ্ত ও শুদ্ধ: ‘The screaming burn victims’। (A) অপ্রয়োজনে দীর্ঘ ও পুনরাবৃত্তিমূলক, (C)-তে ভুল রূপ, (D)-তে বাড়তি verb তৈরি হয়েছে।","stem":"_____were slowly lowered to the ground for medical attention","opts":["The victims who were screaming and who were burning","The screaming burn victims","The screamed burnt victims","The victims who were burning screamed"],"kind":"structure"},{"id":"4-13","t":4,"n":13,"type":"mcq","ans":"D","fix":"","en":"Items in a list must be parallel nouns: ‘stereo, safety devices, air conditioning, and low gas mileage’. The other options mix in a clause (‘it saves gas’) or wrong forms (‘air condition’, ‘air conditioned’).","bn":"তালিকার সব অংশ একই ধরনের (noun) হতে হবে — parallel structure। অন্য অপশনে clause (‘it saves gas’) বা ভুল রূপ (‘air condition’, ‘air conditioned’) আছে।","stem":"This car has many features including _____.","opts":["stereo, safety devices, air condition, and it saves gas","good music, safe devices, air conditioning, and gas","stereo, safety devices, air conditioned, and good gas","stereo, safety devices, air conditioning, and low gas mileage"],"kind":"structure"},{"id":"4-14","t":4,"n":14,"type":"mcq","ans":"A","fix":"","en":"(A) is correct: ‘evidence’ is uncountable and takes ‘was’. (B) uses ‘were’; (C) is wordy (‘at the present time’); (D) is redundant (‘sufficient enough’).","bn":"(A) শুদ্ধ: ‘evidence’ uncountable, তাই ‘was’। (B)-তে ‘were’ ভুল; (C) অপ্রয়োজনে দীর্ঘ; (D)-তে ‘sufficient enough’ redundant।","stem":"The proposal was tabled _____that it would be helpful.","opts":["temporarily because there was not sufficient evidence","because for the time being there were not sufficient evidence","because at the present time there was not sufficient evidence","temporarily because there was not sufficient enough evidence"],"kind":"structure"},{"id":"4-15","t":4,"n":15,"type":"mcq","ans":"C","fix":"","en":"After the preposition ‘for’, use a gerund: ‘for keeping improper financial records’. (A) misuses the adverb ‘improperly’ after ‘were’; (B) uses the non-standard ‘financewise’; (D) uses ‘keep’ instead of ‘keeping’.","bn":"Preposition ‘for’-এর পরে gerund বসে: ‘for keeping improper financial records’। (A)-তে ‘were’-এর পরে adverb ভুল; (B)-তে ‘financewise’ অশুদ্ধ; (D)-তে ‘keeping’-এর বদলে ‘keep’।","stem":"Adams was dismissed from his position _____.","opts":["because his financial records were improperly","because financewise he kept poor records","for keeping improper financial records","for keep financial records that were improper"],"kind":"structure"},{"id":"4-16","t":4,"n":16,"type":"error","ans":"D","fix":"learning about history → history","en":"Items in a series must be parallel nouns: grammar, rhetoric, history, and poetry.","bn":"তালিকার অংশগুলো parallel (সব noun) হতে হবে: grammar, rhetoric, history, and poetry।","parts":[{"k":"A","t":"Some"},"Italian scholars",{"k":"B","t":"stressed"},{"k":"C","t":"the study of"},"grammar, rhetoric,",{"k":"D","t":"learning about history"},", and poetry."]},{"id":"4-17","t":4,"n":17,"type":"error","ans":"A","fix":"carried → carrying","en":"The tank car was carrying the gas; a present participle phrase (‘carrying the toxic gas’) is needed before the main verb ‘derailed’.","bn":"ট্যাংক গাড়িটি গ্যাস বহন করছিল; মূল verb ‘derailed’-এর আগে বর্ণনামূলক অংশ হবে present participle: ‘carrying’।","parts":["When the tank car",{"k":"A","t":"carried"},"the",{"k":"B","t":"toxic"},"gas derailed, the firemen",{"k":"C","t":"tried"},"to isolate the village",{"k":"D","t":"from"},"all traffic."]},{"id":"4-18","t":4,"n":18,"type":"error","ans":"B","fix":"slip → slipped","en":"The sentence is in the past (‘were’, ‘fell’), so ‘slip’ must be ‘slipped’.","bn":"বাক্যটি past tense-এ (were, fell), তাই ‘slip’ নয়, ‘slipped’ হবে।","parts":["While the boys were",{"k":"A","t":"ice skating"},", they",{"k":"B","t":"slip"},"on the thin ice and",{"k":"C","t":"fell"},{"k":"D","t":"into"},"the deep water."]},{"id":"4-19","t":4,"n":19,"type":"error","ans":"D","fix":"and have to pay a fine → and fined","en":"Parallel structure: stopped, ticketed, and fined.","bn":"Parallel structure অনুযায়ী তিনটিই past participle হবে: stopped, ticketed, and fined।","parts":["If motorists do",{"k":"A","t":"not observe"},{"k":"B","t":"the"},"traffic regulations,",{"k":"C","t":"they"},"will be stopped, ticketed,",{"k":"D","t":"and have to pay a fine"},"."]},{"id":"4-20","t":4,"n":20,"type":"error","ans":"C","fix":"had → had had","en":"The accident happened before he failed to show up, so the earlier action takes the past perfect: ‘had had an accident’.","bn":"দুর্ঘটনাটি অনুপস্থিত হওয়ার আগে ঘটেছিল, তাই আগের কাজটি past perfect হবে: ‘had had an accident’।","parts":["Fred, who usually conducts",{"k":"A","t":"the choir rehearsals"},", did not",{"k":"B","t":"show up"},"last night because he",{"k":"C","t":"had"},"an accident",{"k":"D","t":"on his way to the practice"},"."]},{"id":"4-21","t":4,"n":21,"type":"error","ans":"C","fix":"dreams → dreamed","en":"‘Last month’ refers to the past, so use ‘dreamed’.","bn":"‘last month’ অতীত সময় নির্দেশ করে, তাই ‘dreamed’ হবে।","parts":[{"k":"A","t":"A short time"},"before her operation",{"k":"B","t":"last"},"month, Mrs. Carlyle",{"k":"C","t":"dreams"},"of her daughter who",{"k":"D","t":"lives overseas"},"."]},{"id":"4-22","t":4,"n":22,"type":"error","ans":"B","fix":"gives a welcome feeling → welcoming","en":"Parallel adjectives are needed: open, warm, and welcoming.","bn":"Parallel structure: তিনটিই adjective হবে — open, warm, and welcoming।","parts":["The atmosphere in",{"k":"A","t":"Andalucia"},"is open, warm, and",{"k":"B","t":"gives a welcome feeling"},"to all",{"k":"C","t":"who"},"have",{"k":"D","t":"the good"},"fortune to visit there."]},{"id":"4-23","t":4,"n":23,"type":"error","ans":"C","fix":"were → are","en":"‘Now that they have passed’ refers to the present, so use ‘are’.","bn":"‘Now that they have passed’ বর্তমান বোঝায়, তাই ‘were’ নয়, ‘are’ হবে।","parts":[{"k":"A","t":"Now that"},"they have",{"k":"B","t":"successfully"},"passed the TOEFL, the students",{"k":"C","t":"were"},"ready",{"k":"D","t":"to begin"},"their classes at the university."]},{"id":"4-24","t":4,"n":24,"type":"error","ans":"A","fix":"that he was → (delete)","en":"A participial phrase cannot contain a clause; say ‘Being a good swimmer’.","bn":"Participial phrase-এর ভেতরে clause (that he was) বসে না; বলুন ‘Being a good swimmer’।","parts":["Being",{"k":"A","t":"that he was"},"a good swimmer, John jumped",{"k":"B","t":"into"},"the water and",{"k":"C","t":"rescued"},"the",{"k":"D","t":"drowning"},"child."]},{"id":"4-25","t":4,"n":25,"type":"error","ans":"C","fix":"watched → watching","en":"‘Watching the parade’ describes the people (= who were watching), so it must be a participle, parallel to ‘standing’.","bn":"‘watching the parade’ মানুষগুলোকে বর্ণনা করছে (যারা দেখছিল), তাই participle ‘watching’ হবে।","parts":["Some",{"k":"A","t":"of the"},"people were",{"k":"B","t":"standing"},"in the street",{"k":"C","t":"watched"},"the parade, while",{"k":"D","t":"others"},"were singing songs."]},{"id":"4-26","t":4,"n":26,"type":"error","ans":"B","fix":"join together → join","en":"‘Join’ already means ‘put together’, so ‘together’ is redundant.","bn":"‘Join’ মানেই একসাথে যুক্ত করা, তাই ‘together’ বাড়তি (redundant)।","parts":["The carpenters",{"k":"A","t":"tried"},"to",{"k":"B","t":"join together"},"the pieces",{"k":"C","t":"of the"},"broken beam, but",{"k":"D","t":"found it impossible"},"to do."]},{"id":"4-27","t":4,"n":27,"type":"error","ans":"C","fix":"will be leaving → would be leaving","en":"The reporting verb ‘told’ is past, so ‘will’ becomes ‘would’.","bn":"Reporting verb ‘told’ past tense, তাই ‘will’ হবে ‘would’।","parts":["As soon as Pete",{"k":"A","t":"had arrived"},"he told",{"k":"B","t":"us"},"that he",{"k":"C","t":"will be leaving"},"for London tomorrow after",{"k":"D","t":"the"},"board meeting."]},{"id":"4-28","t":4,"n":28,"type":"error","ans":"C","fix":"is → was","en":"The sentence describes a past historical development (‘developed’), so the verb should be ‘was’.","bn":"বাক্যটি অতীতের ঘটনা বর্ণনা করছে (‘developed’), তাই ‘is’ নয়, ‘was’ হবে।","parts":["In Rome, Venice, and",{"k":"A","t":"other"},"cities,",{"k":"B","t":"there developed"},"an intellectual movement called humanism, which",{"k":"C","t":"is"},"the",{"k":"D","t":"basis of"},"the Renaissance."]},{"id":"4-29","t":4,"n":29,"type":"error","ans":"B","fix":"again → (delete)","en":"‘Repeat’ already means ‘do again’, so ‘again’ is redundant.","bn":"‘Repeat’ মানেই আবার করা, তাই ‘again’ বাড়তি।","parts":[{"k":"A","t":"The"},"teacher repeated the assignment",{"k":"B","t":"again"},"for the students,",{"k":"C","t":"since they"},"had difficulty understanding what to do after he",{"k":"D","t":"had explained"},"it the first time."]},{"id":"4-30","t":4,"n":30,"type":"error","ans":"B","fix":"received → receive","en":"Keep the verbs parallel with ‘react’ and ‘display’ (present tense): ‘receive’.","bn":"‘react’ ও ‘display’-এর মতো present tense রাখতে হবে (parallel), তাই ‘receive’।","parts":[{"k":"A","t":"The way we react"},"to other people, the educational training we",{"k":"B","t":"received"},", and the knowledge we display are all",{"k":"C","t":"part"},"of our",{"k":"D","t":"cultural heritage"},"."]},{"id":"4-31","t":4,"n":31,"type":"error","ans":"B","fix":"discussed → will discuss","en":"‘When you come … this afternoon’ refers to the future, so the main clause needs the future.","bn":"‘When you come … this afternoon’ ভবিষ্যৎ বোঝায়, তাই মূল clause-এ future ‘will discuss’ হবে।","parts":[{"k":"A","t":"When"},"you come after class this afternoon, we",{"k":"B","t":"discussed"},{"k":"C","t":"the"},"possibility of",{"k":"D","t":"your"},"writing a research paper."]},{"id":"4-32","t":4,"n":32,"type":"error","ans":"B","fix":"with style → stylishly","en":"Parallel adverbs are needed: ‘gracefully and stylishly’.","bn":"‘gracefully’-এর সাথে parallel adverb হবে: ‘stylishly’।","parts":["Mantovani",{"k":"A","t":"conducted"},"the orchestra gracefully and",{"k":"B","t":"with style"},{"k":"C","t":"to the delight"},"of his",{"k":"D","t":"appreciative"},"audience."]},{"id":"4-33","t":4,"n":33,"type":"error","ans":"C","fix":"it was delivered → he delivered it","en":"The person who finished the paper must be the subject after the participial phrase; otherwise it dangles.","bn":"‘Having finished his term paper’ — যে শেষ করেছে সে-ই কমার পরে subject হবে: ‘he delivered it’; নাহলে dangling participle।","parts":["Having",{"k":"A","t":"finished"},"his term paper",{"k":"B","t":"before the"},"deadline,",{"k":"C","t":"it was delivered"},"to the professor",{"k":"D","t":"before"},"the class."]},{"id":"4-34","t":4,"n":34,"type":"error","ans":"C","fix":"us them → them to us","en":"When both objects are pronouns, put the direct object first and use ‘to’ before the indirect object: ‘told them to us’.","bn":"দুটি object-ই pronoun হলে direct object আগে বসে এবং indirect object-এর আগে ‘to’ লাগে: ‘told them to us’।","parts":[{"k":"A","t":"After learning"},"all the details",{"k":"B","t":"about the project"},", the contractor told",{"k":"C","t":"us them"},"at the",{"k":"D","t":"planning meeting"},"."]},{"id":"4-35","t":4,"n":35,"type":"error","ans":"A","fix":"advanced forward → advanced","en":"‘Advance’ already means ‘move forward’, so ‘forward’ is redundant.","bn":"‘Advance’ মানেই সামনে এগোনো, তাই ‘forward’ বাড়তি।","parts":["The new student's progress",{"k":"A","t":"advanced forward"},"with",{"k":"B","t":"such"},"speed",{"k":"C","t":"that all"},"his teachers",{"k":"D","t":"were amazed"},"."]},{"id":"4-36","t":4,"n":36,"type":"error","ans":"B","fix":"back → (delete)","en":"‘Revert’ already means ‘go back’, so ‘back’ is redundant.","bn":"‘Revert’ মানেই ফিরে যাওয়া, তাই ‘back’ বাড়তি।","parts":["After Mr. Peabody",{"k":"A","t":"had died"},", the money from his estate reverted",{"k":"B","t":"back"},"to the company",{"k":"C","t":"which"},"he",{"k":"D","t":"had served"},"as president for ten years."]},{"id":"4-37","t":4,"n":37,"type":"error","ans":"C","fix":"their → its","en":"‘Village’ is singular, so the possessive should be ‘its’.","bn":"‘Village’ singular, তাই possessive হবে ‘its’।","parts":["In the distance",{"k":"A","t":"could be seen"},"the",{"k":"B","t":"sleepy"},"little village with",{"k":"C","t":"their"},{"k":"D","t":"closely clustered adobe houses"},"and red, clay-tile roofs."]},{"id":"4-38","t":4,"n":38,"type":"error","ans":"B","fix":"a bunch of → many","en":"‘A bunch of’ is informal when used for people; formal English uses ‘many’ or ‘a large number of’.","bn":"মানুষের ক্ষেত্রে ‘a bunch of’ অনানুষ্ঠানিক (slang); formal ইংরেজিতে ‘many’ বা ‘a large number of’।","parts":[{"k":"A","t":"Although"},"the weather was not perfect,",{"k":"B","t":"a bunch of"},"people",{"k":"C","t":"turned out"},{"k":"D","t":"for the annual"},"parade."]},{"id":"4-39","t":4,"n":39,"type":"error", ____ geology, Herman is studying math, French, and literature.","opts":["Besides","Beside"],"kind":"word"},{"id":"5-5","t":5,"n":5,"type":"mcq","ans":"A","fix":"","en":"‘Later (than)’ refers to time; ‘latter’ means the second of two things mentioned.","bn":"সময়ের তুলনায় ‘later’ (পরে); ‘latter’ মানে উল্লিখিত দুটির মধ্যে দ্বিতীয়টি।","stem":"Melanie said that she would arrive _____ than the rest of us.","opts":["later","latter"],"kind":"word"},{"id":"5-6","t":5,"n":6,"type":"mcq","ans":"B","fix":"","en":"The fixed expression is ‘participate in’.","bn":"‘Participate’-এর সাথে নির্দিষ্ট preposition ‘in’ বসে।","stem":"Despite his sore muscle, Paul planned on participating _____ the Olympic skating.","opts":["with","in"],"kind":"word"},{"id":"5-7","t":5,"n":7,"type":"mcq","ans":"B","fix":"","en":"The correct pattern is ‘fear of something’.","bn":"কোনো কিছুর ভয় বোঝাতে ‘fear of’ বসে।","stem":"A fear _____ closed-in areas is called claustrophobia.","opts":["at","of"],"kind":"word"},{"id":"5-8","t":5,"n":8,"type":"mcq","ans":"B","fix":"","en":"‘Prosecute’ means to take legal action against someone; ‘persecute’ means to treat cruelly.","bn":"‘Prosecute’ মানে আদালতে বিচার/মামলা করা; ‘persecute’ মানে নির্যাতন করা।","stem":"After being apprehended, all hijackers are _____.","opts":["persecuted","prosecuted"],"kind":"word"},{"id":"5-9","t":5,"n":9,"type":"mcq","ans":"B","fix":"","en":"‘Lose’ (verb) means to waste or fail to keep; ‘loose’ (adjective) means not tight.","bn":"‘Lose’ (verb) মানে হারানো/নষ্ট করা; ‘loose’ (adjective) মানে ঢিলা।","stem":"Mitzi didn't _____ any time in applying for the teaching position in math.","opts":["loose","lose"],"kind":"word"},{"id":"5-10","t":5,"n":10,"type":"mcq","ans":"B","fix":"","en":"‘All ready’ means completely prepared; ‘already’ means before now.","bn":"‘All ready’ মানে সম্পূর্ণ প্রস্তুত; ‘already’ মানে ইতিমধ্যে।","stem":"The letters were _____ for mailing when we realized that we had written the wrong addresses on the envelopes.","opts":["already","all ready"],"kind":"word"},{"id":"5-11","t":5,"n":11,"type":"mcq","ans":"A","fix":"","en":"‘Quite’ means completely or fairly; ‘quiet’ means silent.","bn":"‘Quite’ মানে সম্পূর্ণ বা বেশ; ‘quiet’ মানে নীরব।","stem":"This report is _____ complete and needs no revision.","opts":["quite","quiet"],"kind":"word"},{"id":"5-12","t":5,"n":12,"type":"mcq","ans":"B","fix":"","en":"‘The latter’ means the second of the two people mentioned (Professor Jones).","bn":"‘The latter’ মানে উল্লিখিত দুজনের দ্বিতীয়জন (Professor Jones)।","stem":"Professor Baker teaches the same number of hours per week as Professor Jones, but the _____ always looks more tired.","opts":["later","latter"],"kind":"word"},{"id":"5-13","t":5,"n":13,"type":"mcq","ans":"A","fix":"","en":"‘Pass out’ means to distribute; ‘samples’ are small free portions of a product (‘examples’ means illustrations).","bn":"‘Pass out’ মানে বিতরণ করা; ‘samples’ মানে নমুনা — ‘examples’ মানে উদাহরণ।","stem":"Ms. Davis asked us to help pass _____ some free _____.","opts":["out … samples","up … samples","out … examples","up … examples"],"kind":"word"},{"id":"5-14","t":5,"n":14,"type":"mcq","ans":"D","fix":"","en":"‘Too + adjective’ means more than acceptable, and ‘loose’ (adjective) means not tight: ‘too loose’.","bn":"‘Too + adjective’ মানে প্রয়োজনের চেয়ে বেশি, আর ‘loose’ মানে ঢিলা — তাই ‘too loose’।","stem":"Julie's skirt will be _____ _____ for her sister to wear.","opts":["to … lose","too … lose","to … loose","too … loose"],"kind":"word"},{"id":"5-15","t":5,"n":15,"type":"mcq","ans":"B","fix":"","en":"After ‘to’, a verb is needed: ‘accept’ means to receive; ‘except’ is a preposition meaning ‘but / other than’.","bn":"‘to’-এর পরে verb লাগে: ‘accept’ (গ্রহণ করা); ‘except’ হলো preposition, মানে ‘ছাড়া’।","stem":"Even though Marlon Brando had won an Oscar, he refused to _____ it at the presentation ceremonies.","opts":["except","accept"],"kind":"word"},{"id":"5-16","t":5,"n":16,"type":"mcq","ans":"B","fix":"","en":"‘Count on’ means to depend on or rely on; ‘pick out’ means to choose.","bn":"‘Count on’ মানে নির্ভর করা; ‘pick out’ মানে বেছে নেওয়া।","stem":"Louis was ⟦depending on⟧ the Pittsburgh Steelers to win the championship.","opts":["picking out","counting on"],"kind":"syn"},{"id":"5-17","t":5,"n":17,"type":"mcq","ans":"A","fix":"","en":"‘Pass out’ means to distribute; ‘bring up’ means to mention or raise a topic.","bn":"‘Pass out’ মানে বিতরণ করা; ‘bring up’ মানে কোনো প্রসঙ্গ তোলা।","stem":"Dr. Clements ⟦distributed⟧ the materials at the deans' conference.","opts":["passed out","brought up"],"kind":"syn"},{"id":"5-18","t":5,"n":18,"type":"mcq","ans":"A","fix":"","en":"‘Keep on’ means to continue; ‘do away with’ means to abolish.","bn":"‘Keep on’ মানে চালিয়ে যাওয়া; ‘do away with’ মানে বিলুপ্ত করা।","stem":"Archeologists ⟦continue⟧ searching for buried Egyptian treasures.","opts":["keep on","do away with"],"kind":"syn"},{"id":"5-19","t":5,"n":19,"type":"mcq","ans":"A","fix":"","en":"‘Hold up’ means to rob, usually with a weapon; ‘point out’ means to indicate.","bn":"‘Hold up’ মানে (সাধারণত অস্ত্রের মুখে) ডাকাতি করা; ‘point out’ মানে দেখিয়ে দেওয়া।","stem":"Four armed men ⟦robbed⟧ the bank last week and escaped with an undetermined amount of cash.","opts":["held up","pointed out"],"kind":"syn"},{"id":"5-20","t":5,"n":20,"type":"mcq","ans":"B","fix":"","en":"‘Put off’ means to postpone; ‘drop out of’ means to leave a course or program.","bn":"‘Put off’ মানে স্থগিত করা; ‘drop out of’ মানে মাঝপথে ছেড়ে দেওয়া।","stem":"We had to ⟦postpone⟧ the meeting because too many people had the flu.","opts":["drop out of","put off"],"kind":"syn"},{"id":"5-21","t":5,"n":21,"type":"mcq","ans":"A","fix":"","en":"‘Get along (without)’ means to manage; ‘take off’ means to leave the ground or remove.","bn":"‘Get along’ মানে কোনোভাবে চালিয়ে নেওয়া; ‘take off’ মানে উড্ডয়ন করা বা খুলে ফেলা।","stem":"When Karen became ill, her colleagues had to ⟦manage⟧ without her.","opts":["get along","take off"], function buildQ(it,nOpts){
 const i=Math.floor(Math.random()*it.say.length);
 const right=it.say[i];
 const wrongOwn=it.dont.length===it.say.length?it.dont[i]:pick(it.dont);
 const used=new Set([norm(right),norm(wrongOwn)]);
 const wrongs=[wrongOwn];
 for(const o of shuffle(QI)){
  if(wrongs.length>=nOpts-1)break;
  if(o.k===it.k)continue;
  const w=pick(o.dont);
  if(used.has(norm(w)))continue;
  used.add(norm(w));wrongs.push(w);
 }
 const opts=shuffle([right].concat(wrongs));
 return{it,opts,ans:opts.indexOf(right),right};
}
const why=it=>'<div class="note"><b>'+it.n+'. '+esc(it.title)+'</b>'+(it.note?'\n'+esc(it.note.length>300?it.note.slice(0,300)+'…':it.note):'')+'</div>';
/* ---------- practice ---------- */
function renderPStats(){
 const w=QI.filter(i=>S.wrong[i.k]>0).length;
 $('#pstats').innerHTML='<div><b>'+D().practice+'</b><span>today</span></div><div><b>'+w+'</b><span>to review</span></div><div><b>'+readCount()+'</b><span>read</span></div>';
}
function poolFor(src){
 let p=QI;
 if(src==='read')p=p.filter(i=>S.learned[i.k]);
 if(src==='new')p=p.filter(i=>!S.learned[i.k]);
 if(src==='wrong')p=p.filter(i=>S.wrong[i.k]>0);
 if(src==='star')p=p.filter(i=>S.star[i.k]);
 return p;
}
let pq=null,lastK=null;
function nextP(){
 const mode=$('#pmode').value,pool=poolFor($('#psrc').value);
 if(!pool.length){pq=null;$('#parea').innerHTML='<div class="empty">No questions in this set yet. Try “All questions”.</div>';return}
 let it=pick(pool);
 if(pool.length>1)while(it.k===lastK)it=pick(pool);
 lastK=it.k;
 if(mode==='mcq'){
  pq=buildQ(it,2);
  $('#parea').innerHTML='<div class="card"><div class="mut">Which sentence is correct?</div>'+pq.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o)+'</button>').join('')+'<div id="pfb"></div></div>';
 }else{
  pq={it,flash:true};
  $('#parea').innerHTML='<div class="card flip"><div class="mut">Fix this sentence, then tap “Show answer”</div><div class="dont">'+esc(pick(it.dont))+'</div><div id="pfb"></div><div class="row2" style="margin-top:8px"><button class="btn pri" id="pshow">Show answer</button></div></div>';
 }
}
$('#pstart').onclick=nextP;
$('#parea').onclick=e=>{
 const b=e.target.closest('button');if(!b||!pq)return;
 if(b.id==='pnext'){nextP();return}
 if(b.id==='pshow'){
  $('#pfb').innerHTML='<div class="say">'+esc(pick(pq.it.say))+'</div>'+why(pq.it)+'<div class="row2" style="margin-top:8px"><button class="btn" data-k="0">❌ Missed</button><button class="btn pri" data-k="1">✅ Knew it</button></div>';
  b.style.display='none';return;
 }
 if(b.dataset.k!==undefined){
  const n=pq.it.k;
  if(b.dataset.k==='1')S.wrong[n]=Math.max(0,(S.wrong[n]||0)-1);else S.wrong[n]=(S.wrong[n]||0)+1;
  save();addPractice();nextP();return;
 }
 if(b.classList.contains('opt')&&!b.disabled){
  const i=+b.dataset.i,n=pq.it.k;
  document.querySelectorAll('#parea .opt').forEach((o,k)=>{o.disabled=true;if(k===pq.ans)o.classList.add('right');else if(k===i)o.classList.add('wrong')});
  if(i===pq.ans)S.wrong[n]=Math.max(0,(S.wrong[n]||0)-1);else S.wrong[n]=(S.wrong[n]||0)+1;
  save();addPractice();
  $('#pfb').innerHTML=(i===pq.ans?'<b style="color:var(--ok)">Correct!</b>':'<b style="color:var(--bad)">Not quite.</b>')+why(pq.it)+'<div class="row2" style="margin-top:8px"><button class="btn pri" id="pnext">Next →</button></div>';
 }
};
/* ---------- exam ---------- */
let ex=null,exT=null;
function examPool(){return $('#exsrc').value==='read'?QI.filter(i=>S.learned[i.k]):QI}
function renderExamInfo(){
 const e=readQuizCount(),r=readCount();
 $('#exinfo').innerHTML='পড়া নিয়ম: <b>'+r+'</b> টি · এর মধ্যে পরীক্ষার উপযোগী: <b>'+e+'</b> টি'+(e<4?'<br><span style="color:var(--bad)">Read-based exam needs at least 4 rules. Study সেকশনে আরও নিয়ম “Mark as read” করুন।</span>':'');
}
function startExam(){
 const pool=examPool();
 if(pool.length<4){$('#exinfo').innerHTML+='<br><b style="color:var(--bad)">'+($('#exsrc').value==='read'?'আগে Study সেকশনে অন্তত ৪টি নিয়ম “Mark as read” করুন।':'Not enough questions.')+'</b>';return}
 const n=Math.min(+$('#exn').value,pool.length);
 const qs=shuffle(pool).slice(0,n).map(it=>buildQ(it,4));
 ex={qs,ans:new Array(n).fill(-1),i:0,left:n*30};
 $('#exsetup').style.display='none';$('#exrun').style.display='block';
 clearInterval(exT);exT=setInterval(()=>{if(!ex){clearInterval(exT);return}ex.left--;const t=$('#extime');if(t)t.textContent=fmt(Math.max(0,ex.left));if(ex.left<=0)finishExam()},1000);
 renderEx();
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function renderEx(){
 const q=ex.qs[ex.i],n=ex.qs.length;
 $('#exrun').innerHTML='<div class="row2" style="justify-content:space-between"><b>Q '+(ex.i+1)+' / '+n+'</b><span class="timer" id="extime">'+fmt(ex.left)+'</span></div>'+
 '<div class="prog"><i style="width:'+((ex.i+1)/n*100)+'%"></i></div>'+
 '<div class="card"><div class="mut">Choose the correct sentence</div>'+q.opts.map((o,i)=>'<button class="opt'+(ex.ans[ex.i]===i?' sel':'')+'" data-i="'+i+'">'+esc(o)+'</button>').join('')+'</div>'+
 '<div class="row2" style="justify-content:space-between"><button class="btn" id="exprev"'+(ex.i?'':' disabled')+'>← Prev</button>'+
 (ex.i<n-1?'<button class="btn pri" id="exnext">Next →</button>':'<button class="btn pri" id="exfin">'+(ex.sure?'Finish anyway':'Finish')+'</button>')+'</div>'+
 (ex.sure?'<p style="color:var(--bad);margin:8px 2px 0">'+ex.ans.filter(a=>a<0).length+'টি প্রশ্নের উত্তর দেওয়া হয়নি। তবুও শেষ করতে “Finish anyway” চাপুন।</p>':'')+
 '<p class="mut">Answered '+ex.ans.filter(a=>a>=0).length+' of '+n+'</p>';
}
$('#exstart').onclick=startExam;
$('#exsrc').onchange=renderExamInfo;
$('#exrun').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='exagain'){$('#exrun').style.display='none';$('#exsetup').style.display='block';renderHist();renderExamInfo();return}
 if(!ex)return;
 if(b.classList.contains('opt')){ex.ans[ex.i]=+b.dataset.i;ex.sure=false;renderEx()}
 else if(b.id==='exnext'){ex.i++;renderEx()}
 else if(b.id==='exprev'){ex.i--;renderEx()}
 else if(b.id==='exfin'){const un=ex.ans.filter(a=>a<0).length;if(un&&!ex.sure){ex.sure=true;renderEx();return}finishExam()}
};
function finishExam(){
 clearInterval(exT);if(!ex)return;
 const n=ex.qs.length;let score=0;const miss=[];
 ex.qs.forEach((q,i)=>{if(ex.ans[i]===q.ans){score++;S.wrong[q.it.k]=Math.max(0,(S.wrong[q.it.k]||0)-1)}else{S.wrong[q.it.k]=(S.wrong[q.it.k]||0)+1;miss.push(i)}});
 const used=n*30-Math.max(0,ex.left),pct=Math.round(score/n*100);
 S.exams.unshift({d:today(),score,n,pct,used});S.exams=S.exams.slice(0,30);save();
 $('#exrun').innerHTML='<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:700;color:'+(pct>=60?'var(--ok)':'var(--bad)')+'">'+pct+'%</div><div>'+score+' / '+n+' correct · '+(pct>=60?'Passed 🎉':'Keep practising 💪')+'</div><div class="mut">Time used '+fmt(used)+'</div></div>'+
 (miss.length?'<h3>Review your mistakes</h3>'+miss.map(i=>{const q=ex.qs[i];return '<div class="res"><div class="dont">'+esc(ex.ans[i]>=0?q.opts[ex.ans[i]]:'(not answered)')+'</div><div class="say">'+esc(q.right)+'</div>'+why(q.it)+'</div>'}).join(''):'<div class="empty">Perfect score!</div>')+
 '<div class="row2"><button class="btn pri" id="exagain">Back</button></div>';
 ex=null;window.scrollTo(0,0);
}
function renderHist(){
 $('#exhist').innerHTML=S.exams.length?S.exams.slice(0,10).map(h=>'<div class="card row2" style="justify-content:space-between;margin:6px 0"><span>'+esc(h.d)+'</span><span>'+h.score+'/'+h.n+'</span><b style="color:'+(h.pct>=60?'var(--ok)':'var(--bad)')+'">'+h.pct+'%</b></div>').join(''):'<div class="empty">No exams yet.</div>';
}
/* ---------- init ---------- */
renderDaily();renderStudy(true);renderPStats();renderExamInfo();
/* ---------- TOEFL mini tests ---------- */
if(!S.toefl||typeof S.toefl!=='object')S.toefl={};
if(!S.twrong||typeof S.twrong!=='object')S.twrong={};
if(!S.tfrun||typeof S.tfrun!=='object')S.tfrun={};
const TF=TOEFL;
const TFT=[...new Set(TF.map(q=>q.t))];
const TFID={};TF.forEach(q=>TFID[q.id]=q);
const TFDESC={1:'Error identification',2:'Error identification',3:'Error identification',4:'Structure + Written Expression',5:'Word choice & phrasal verbs',6:'Error identification'};
const TFPROMPT={
 error:'Which underlined part is incorrect? · দাগানো কোন অংশটি ভুল?',
 structure:'Choose the option that best completes the sentence. · শূন্যস্থানে কোনটি বসবে?',
 word:'Choose the correct word. · সঠিক শব্দটি বাছুন।',
 syn:'Which can replace the underlined word? · দাগানো শব্দের জায়গায় কোনটি বসবে?'
};
const L4=['A','B','C','D'];
const tfKind=q=>q.type==='error'?'error':(q.kind||'structure');
function tfSent(q,mark){
 if(q.type==='error'){
  let h='';
  q.parts.forEach(p=>{
   const s=typeof p==='string'?esc(p):'<span class="ul'+(mark&&mark[p.k]?' '+mark[p.k]:'')+'">'+esc(p.t)+'</span><span class="lab">'+p.k+'</span>';
   const raw=typeof p==='string'?p:p.t;
   h+=(h&&!/^[,.;:?!)]/.test(raw)?' ':'')+s;
  });
  return h;
 }
 return esc(q.stem).replace(/⟦(.+?)⟧/g,'<span class="ul">$1</span>').replace(/_{3,}/g,'<span class="blank">_____</span>');
}
const tfOpt=(q,i)=>q.type==='error'?q.parts.find(p=>typeof p!=='string'&&p.k===L4[i]).t:q.opts[i];
const tfNopt=q=>q.type==='error'?4:q.opts.length;
function tfExplain(q){
 return (q.fix?'<div class="fx"><b>সংশোধন:</b> '+esc(q.fix)+'</div>':'')+
  '<div class="ex"><span class="tag">EN</span>'+esc(q.en)+'</div>'+
  '<div class="ex"><span class="tag">বাংলা</span>'+esc(q.bn)+'</div>'+
  (q.note?'<div class="ex nt"><span class="tag">নোট</span>'+esc(q.note)+'</div>':'');
}
function renderTFHome(){
 const wn=TF.filter(q=>S.twrong[q.id]).length;
 $('#tfhome').innerHTML=
  '<p class="mut" style="margin:0 2px 8px">Cliffs TOEFL-এর mini test। প্রতিটি উত্তরের পর সংশোধন এবং ইংরেজি ও বাংলায় ব্যাখ্যা দেখাবে।</p>'+
  TFT.map(t=>{
   const qs=TF.filter(q=>q.t===t),r=S.toefl[t];
   return '<div class="card"><div class="row2" style="justify-content:space-between"><div><div class="ttl">Mini Test '+t+'</div><div class="mut">'+qs.length+' questions · '+TFDESC[t]+'</div></div>'+
    (r?'<div style="text-align:right"><b style="color:'+(r.best>=60?'var(--ok)':'var(--bad)')+'">'+r.best+'%</b><div class="mut" style="font-size:12px">best · last '+r.last+'%</div></div>':'<span class="chip">New</span>')+'</div>'+
    '<div class="row2" style="margin-top:10px">'+(S.tfrun[t]?'<button class="btn pri sm" data-tf="cont" data-t="'+t+'">▶ Continue (Q '+(S.tfrun[t].i+1)+'/'+qs.length+')</button><button class="btn sm" data-tf="start" data-t="'+t+'">↺ Restart</button>':'<button class="btn pri sm" data-tf="start" data-t="'+t+'">▶ Start</button>')+'<button class="btn sm" data-tf="key" data-t="'+t+'">📋 Answer key</button></div></div>';
  }).join('')+
  '<div class="card"><div class="row2" style="justify-content:space-between"><div><div class="ttl">My TOEFL mistakes</div><div class="mut">'+wn+' questions to review</div></div><button class="btn sm'+(wn?' pri':'')+'" data-tf="wrong"'+(wn?'':' disabled')+'>Retry</button></div></div>';
}
let tr=null;
function tfSave(){if(tr&&tr.t&&!tr.finished){S.tfrun[tr.t]={i:tr.i,score:tr.score,picked:tr.picked,wrong:tr.wrong.map(q=>q.id)};save()}}
function tfStart(list,label,t,resume){
 tr={list,i:0,score:0,label,t,picked:null,wrong:[]};
 const r=t&&resume?S.tfrun[t]:null;
 if(r&&r.i<list.length){tr.i=r.i;tr.score=r.score||0;tr.picked=r.picked==null?null:r.picked;tr.wrong=(r.wrong||[]).map(id=>TFID[id]).filter(Boolean)}
 else if(t){delete S.tfrun[t];save()}
 $('#tfhome').style.display='none';$('#tfrun').style.display='block';window.scrollTo(0,0);renderTF();
}
function tfBack(){tr=null;$('#tfrun').style.display='none';$('#tfhome').style.display='block';renderTFHome();window.scrollTo(0,0)}
function renderTF(){
 const q=tr.list[tr.i],n=tr.list.length,done=tr.picked!==null,ai=L4.indexOf(q.ans);
 const mark={};
 if(done&&q.type==='error'){mark[q.ans]='good';if(tr.picked!==ai)mark[L4[tr.picked]]='bad'}
 let h='<div class="row2" style="justify-content:space-between"><b>'+esc(tr.label)+'</b><button class="btn sm" data-tf="exit">✕ Exit</button></div>'+
  '<div class="row2" style="justify-content:space-between;margin-top:6px"><span class="mut">Q '+(tr.i+1)+' / '+n+' · No. '+q.n+(tr.t?'':' (Test '+q.t+')')+'</span><span class="mut">Score '+tr.score+'</span></div>'+
  '<div class="prog"><i style="width:'+((tr.i+(done?1:0))/n*100)+'%"></i></div>'+(tr.t?'<div class="mut" style="font-size:12px;margin:-4px 2px 6px">Exit করলে অগ্রগতি সেভ থাকবে — পরে Continue চাপুন।</div>':'')+
  '<div class="card"><div class="mut" style="margin-bottom:6px">'+TFPROMPT[tfKind(q)]+'</div><div class="sent">'+tfSent(q,mark)+'</div>';
 for(let i=0;i<tfNopt(q);i++){
  let c='opt';if(done){if(i===ai)c+=' right';else if(i===tr.picked)c+=' wrong'}
  h+='<button class="'+c+'" data-tfi="'+i+'"'+(done?' disabled':'')+'><b>('+L4[i]+')</b> '+esc(tfOpt(q,i))+'</button>';
 }
 if(done){
  h+='<div class="fb">'+(tr.picked===ai?'<b style="color:var(--ok)">✓ সঠিক!</b>':'<b style="color:var(--bad)">✗ সঠিক উত্তর: ('+q.ans+')</b>')+tfExplain(q)+'</div>'+
   '<div class="row2" style="margin-top:10px;justify-content:flex-end"><button class="btn pri" data-tf="next">'+(tr.i<n-1?'Next →':'See result')+'</button></div>';
 }
 h+='</div>';
 $('#tfrun').innerHTML=h;
}
function tfFinish(){
 tr.finished=true;
 if(tr.t){delete S.tfrun[tr.t];save()}
 const n=tr.list.length,pct=Math.round(tr.score/n*100);
 if(tr.t){const r=S.toefl[tr.t]||{best:0};S.toefl[tr.t]={best:Math.max(r.best||0,pct),last:pct,d:today()};save()}
 $('#tfrun').innerHTML='<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:700;color:'+(pct>=60?'var(--ok)':'var(--bad)')+'">'+pct+'%</div><div>'+tr.score+' / '+n+' correct</div><div class="mut">'+esc(tr.label)+'</div></div>'+
  (tr.wrong.length?'<h3 style="margin:14px 2px 4px;font-size:16px">Review your mistakes</h3>'+tr.wrong.map(q=>'<div class="res"><div class="mut">No. '+q.n+' · answer ('+q.ans+')</div><div class="sent" style="font-size:15px">'+tfSent(q,q.type==='error'?{[q.ans]:'good'}:null)+'</div>'+tfExplain(q)+'</div>').join(''):'<div class="empty">Perfect score! 🎉</div>')+
  '<div class="row2"><button class="btn pri" data-tf="exit">Back</button>'+(tr.wrong.length?'<button class="btn" data-tf="redo">Retry these '+tr.wrong.length+'</button>':'')+'</div>';
 window.scrollTo(0,0);
}
function tfKey(t){
 const qs=TF.filter(q=>q.t===t);
 $('#tfhome').style.display='none';$('#tfrun').style.display='block';tr=null;
 $('#tfrun').innerHTML='<div class="row2" style="justify-content:space-between"><b>Mini Test '+t+' · Answer key</b><button class="btn sm" data-tf="exit">✕ Close</button></div>'+
  qs.map(q=>'<div class="card"><div class="mut">No. '+q.n+' · answer <b style="color:var(--ok)">('+q.ans+')</b>'+(q.type==='error'?'':' '+esc(tfOpt(q,L4.indexOf(q.ans))))+'</div><div class="sent" style="font-size:15px">'+tfSent(q,q.type==='error'?{[q.ans]:'good'}:null)+'</div>'+tfExplain(q)+'</div>').join('');
 window.scrollTo(0,0);
}
$('#v-toefl').onclick=e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 const a=b.dataset.tf;
 if(a==='start'){const t=+b.dataset.t;tfStart(TF.filter(q=>q.t===t),'Mini Test '+t,t);return}
 if(a==='key'){tfKey(+b.dataset.t);return}
 if(a==='wrong'){tfStart(shuffle(TF.filter(q=>S.twrong[q.id])),'My TOEFL mistakes',0);return}
 if(a==='exit'){tfSave();tfBack();return}
 if(a==='cont'){const t=+b.dataset.t;tfStart(TF.filter(q=>q.t===t),'Mini Test '+t,t,true);return}
 if(a==='redo'){tfStart(tr.wrong.slice(),'Retry mistakes',0);return}
 if(a==='next'){if(tr.i<tr.list.length-1){tr.i++;tr.picked=null;tfSave();renderTF();window.scrollTo(0,0)}else tfFinish();return}
 if(b.dataset.tfi!==undefined&&tr&&tr.picked===null){
  const i=+b.dataset.tfi,q=tr.list[tr.i];
  tr.picked=i;
  if(L4[i]===q.ans){tr.score++;delete S.twrong[q.id]}else{S.twrong[q.id]=1;tr.wrong.push(q)}
  save();tfSave();addPractice();renderTF();
 }
};
renderTFHome();
</script>
