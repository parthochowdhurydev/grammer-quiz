e two (three, etc.) last নয়।","pg":69,"q":true},{"n":374,"title":"Such বা so-এর সাথে indefinite article-এর ভুল (misplaced) অবস্থান:","dont":["I never met a such good man before."],"say":["I never met such a good man before."],"note":"Indefinite article a বা an, such-এর পরে বসা উচিত, যেমন: such a good man; so-এর ক্ষেত্রে: so good a man।","pg":69,"q":true},{"n":375,"title":"Half-এর সাথে definite article-এর ভুল (misplaced) অবস্থান:","dont":["The half year is nearly finished."],"say":["Half the year is nearly finished."],"note":"‘Half the year’ হল ‘half of the year’-এর সংক্ষিপ্ত রূপ।","pg":70,"q":true},{"n":376,"title":"Most of-এর পরিবর্তে the most of ব্যবহার জনিত ভুল:","dont":["The most of the girls are not present."],"say":["Most of the girls are not present."],"note":"Note: The most of অশুদ্ধ; বলুন most of the girls।","pg":70,"q":true},{"n":378,"title":"প্রথমে নিজেকে উল্লেখ করা জনিত ভুল (Mentioning oneself first):","dont":["Only I and my mother are present."],"say":["Only my mother and I are present."],"note":"ইংরেজি রীতিতে কেউ যখন একই সাথে নিজের এবং অন্যদের কথা বলে, তখন অন্যদের আগে এবং নিজেকে পরে উল্লেখ করতে হয়।\nNote: তবে দোষ স্বীকার করার সময় প্রথমে নিজেকে উল্লেখ করা যায়, যেমন: I and my brother broke the window.","pg":70,"q":true},{"n":379,"title":"To এবং At.","dont":["We come at school every morning.","Someone is standing to the door."],"say":["We come to school every morning.","Someone is standing at the door."],"note":"এক স্থান থেকে অন্য স্থানে গতি বোঝাতে to ব্যবহৃত হয়; পক্ষান্তরে অবস্থান বা স্থিতি বোঝাতে at ব্যবহৃত হয়।","pg":72,"q":true},{"n":380,"title":"To এবং Till","dont":["We walked till the river and back.","I'll stay here to next month."],"say":["We walked to the river and back.","I'll stay here till next month."],"note":"দূরত্ব বোঝাতে to এবং সময় বোঝাতে till (until) ব্যবহৃত হয়।","pg":72,"q":true},{"n":381,"title":"In এবং At","dont":["Liam has a flat at Paris.","My mother is staying in 66 Argyle Street."],"say":["Liam has a flat in Paris.","My mother is staying at 66 Argyle Street."],"note":"In সাধারণত দেশ ও বড় শহরের নামের পূর্বে বসে। At ছোট শহর ও গ্রামের নামের পূর্বে বসে। এছাড়া নম্বরসহ ঠিকানা, public place (a bus stop, the Post Office, the library ইত্যাদি) এবং যেসব জায়গায় কী হয় তা আমরা জানি (school, the dentist, dance class ইত্যাদি) বোঝাতে at ব্যবহার করি।","pg":72,"q":true},{"n":382,"title":"In এবং Into","dont":["Gemma spent all the day into her room.","Richard came in the room and sat down."],"say":["Gemma spent all the day in her room.","Richard came into the room and sat down."],"note":"কোনো কিছুর ভেতরে অবস্থান বা স্থিতি বোঝাতে in ব্যবহৃত হয়; আর বাইরে থেকে ভেতরের দিকে গতি বোঝাতে into ব্যবহৃত হয়।\nNote: Into preposition-টি সর্বদা একটি word হিসেবে লেখা হয়।","pg":73,"q":true},{"n":383,"title":"On, At, In (সময় প্রকাশ করতে)","dont":["My uncle will arrive at Saturday.","I usually get up on seven o'clock."],"say":["My uncle will arrive on Saturday.","I usually get up at seven o'clock."],"note":"1) সপ্তাহের দিন বা তারিখের সাথে on ব্যবহৃত হয়, যেমন: on Friday, on March 25, on New Year's Day।\n2) সুনির্দিষ্ট সময়ের সাথে at ব্যবহৃত হয়, যেমন: at four o'clock, at dawn, at noon, at sunset, at midnight।\n3) দীর্ঘ সময়কালের সাথে in ব্যবহৃত হয়, যেমন: in April, in winter, in 1945, in the morning; তবে at night এবং by day হয়।","pg":73,"q":true},{"n":384,"title":"For এবং At (মূল্য প্রকাশ করতে)","dont":["I bought a book at fifty pence.","I can’t buy it for such a high price."],"say":["I bought a book for fifty pence.","I can’t buy it at such a high price."],"note":"Note: প্রকৃত (নির্দিষ্ট) মূল্য উল্লেখ থাকলে for ব্যবহৃত হয়; প্রকৃত মূল্য উল্লেখ না থাকলে at বসে। তবে প্রকৃত মূল্যের পরে ওজন বা পরিমাপ থাকলে at ব্যবহৃত হতে পারে, যেমন: That velvet is available at £5 a metre.","pg":73,"q":true},{"n":385,"title":"Between এবং Among","dont":["There was a fight among two boys.","Divide the apple between you three."],"say":["There was a fight between two boys.","Divide the apple among you three."],"note":"কেবল দু’জন বা দুটি বস্তুর মধ্যে বোঝালে between ব্যবহৃত হয়; পক্ষান্তরে দু’য়ের অধিক বোঝালে among ব্যবহৃত হয়।","pg":74,"q":true},{"n":386,"title":"Beside এবং Besides","dont":["Charlie was standing just besides me.","We study French beside English."],"say":["Charlie was standing just beside me.","We study French besides English."],"note":"Beside অর্থ হল পাশে (by the side of) এবং besides অর্থ হল অধিকন্তু / এছাড়াও (in addition to)।","pg":74,"q":true},{"n":388,"title":"With-এর পরিবর্তে by ব্যবহার জনিত ভুল:","dont":["The man shot the bird by a gun."],"say":["The man shot the bird with a gun."],"note":"যে উপকরণ বা যন্ত্রের সাহায্যে আমরা কোনো কাজ করি, তা বোঝাতে with ব্যবহার করি। কাজটি যে করে তাকে বোঝাতে by ব্যবহৃত হয়, যেমন: The bird was shot by the man.\nNote: তবে নিচের ক্ষেত্রগুলোতে by বসে, with নয়: by (electric) light, by steam, by hand, by post, by telephone, by one’s watch, by the day, by the dozen, by the yard.","pg":74,"q":true},{"n":391,"title":"About-এর পরিবর্তে for ব্যবহার জনিত ভুল:","dont":["The teacher spoke for bad habits."],"say":["The teacher spoke about bad habits."],"note":"‘সম্বন্ধে’ (about) অর্থে for ব্যবহৃত হতে পারে না। For প্রধানত ‘কোনো কিছুর পক্ষে’ বা ‘কোনো কিছুর উদ্দেশ্যে’ অর্থ নির্দেশ করে। সুতরাং The teacher spoke for bad habits বললে বোঝায় যে তিনি মন্দ অভ্যাসগুলোর পক্ষে বলেছিলেন!","pg":75,"q":true},{"n":392,"title":"For-এর পরিবর্তে since ব্যবহার জনিত ভুল:","dont":["She's lived here since two years."],"say":["She’s lived here for two years."],"note":"সময়ের ব্যাপ্তিকাল নির্দেশক word বা phrase-এর পূর্বে for বসে, যেমন: for three days, for six weeks, for two years, for a few minutes, for a long time। এটি simple present ব্যতীত যে কোনো tense-এর সাথে ব্যবহৃত হতে পারে।\nNote: For প্রায়ই উহ্য থাকে: I've been here for two years বা I've been here two years.","pg":75,"q":true},{"n":393,"title":"Since-এর পরিবর্তে from ব্যবহার জনিত ভুল:","dont":["Ian's been ill from last Friday."],"say":["Ian’s been ill since last Friday."],"note":"কোনো নির্দিষ্ট সময়-বিন্দু থেকে শুরু বোঝাতে word বা phrase-এর পূর্বে since বসে, যেমন: since Monday, since yesterday, since eight o'clock, since Christmas। Since ব্যবহৃত হলে verb সাধারণত present perfect tense-এ হয়; তবে past perfect-এও হতে পারে, যেমন: I was glad to see Tom. I hadn't seen him since last Christmas.\nNote: From-ও সময়ের শুরুর বিন্দু নির্দেশ করতে পারে, তবে এর পরে অবশ্যই to বা till বসবে, যেমন: He works from eight o'clock till one o'clock without a break.","pg":75,"q":true},{"n":394,"title":"In-এর পরিবর্তে after ব্যবহার জনিত ভুল:","dont":["I may be able to go after a week."],"say":["I may be able to go in a week."],"note":"Or: I may be able to go in a week's time.\nভবিষ্যতের কোনো সময়-ব্যবধানের কথা বললে আমরা অবশ্যই in ব্যবহার করব, after নয়। এখানে in অর্থ হল ‘নির্দিষ্ট সময় শেষ হলে’ (at the end of)।","pg":76,"q":true},{"n":395,"title":"Within-এর পরিবর্তে in ব্যবহার জনিত ভুল:","dont":["Come back in an hour."],"say":["Come back within an hour."],"note":"In অর্থ হল নির্দিষ্ট সময় শেষ হলে (after the end of) এবং within অর্থ হল নির্দিষ্ট সময় শেষ হওয়ার আগেই (before the end of)।\nসতর্কতা: “Come back in an hour.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":76,"q":false},{"n":396,"title":"Shall এবং Will.","dont":["I will go tomorrow if it’s fine.","She tells me you shall go tomorrow."],"say":["I shall go tomorrow if it’s fine.","She tells me you will go tomorrow."],"note":"a) সাধারণ ভবিষ্যৎ প্রকাশ করতে প্রথাগত নিয়মে first person-এর সাথে shall এবং second ও third person-এর সাথে will ব্যবহার করা হয়।\nb) দৃঢ়তা বা ব্যক্তিগত সংকল্প বোঝাতে first person-এর সাথে will, এবং আদেশ বা প্রতিজ্ঞা বোঝাতে second ও third person-এর সাথে shall ব্যবহৃত হয়।\nNote: Should হল shall-এর past tense এবং would হল will-এর past tense; এদের মধ্যেও একই পার্থক্য বিদ্যমান, যেমন: I was afraid that I should fail; I promised that I would help him.\nসতর্কতা: আধুনিক ইংরেজিতে first person-এর সাথেও will ব্যাপকভাবে ব্যবহৃত ও গ্রহণযোগ্য।","pg":77,"q":false},{"n":398,"title":"Say এবং Tell","dont":["He told, ‘I’ll go home.’","He told that he’d go home.","He said me that he would go home."],"say":["He said, ‘I’ll go home.’","He said that he’d go home.","He told me that he would go home."],"note":"To say ব্যবহৃত হয় 1) কারো হুবহু বক্তব্য উদ্ধৃত করতে, এবং 2) indirect speech-এ, যখন বাক্যে কোনো indirect object থাকে না। To tell ব্যবহৃত হয় indirect speech-এ, যখন বাক্যে একটি indirect object থাকে। শেষ বাক্যে indirect object হচ্ছে me।\nNote: Say এবং tell সমেত প্রচলিত idiom-গুলো:\na) to say one’s prayers, to say grace, to say ‘Good morning’, to say something or nothing, to say no more, to say a good word for, to say so.\nb) to tell the truth, to tell a lie, to tell a story, to tell the time, to tell a secret, to tell the price, to tell one’s fortune, to tell one’s name.","pg":78,"q":true},{"n":399,"title":"Make এবং Do","dont":["The carpenter did a large table.","You must make your work carefully."],"say":["The carpenter made a large table.","You must do your work carefully."],"note":"To make প্রধানত (কোনো কিছু) নির্মাণ বা তৈরি করা অর্থ নির্দেশ করে; পক্ষান্তরে to do অর্থ হল কোনো কাজ করা বা সম্পন্ন করা।\nNote: Make এবং do সমেত প্রচলিত idiom-গুলো:\na) to make a mistake, to make a promise, to make a speech, to make an excuse, to make haste, to make fun of, to make a bed (= ঘুমানোর জন্য বিছানা গোছানো)।\nb) to do good, to do evil, to do one’s best, to do someone a favour, to do wrong, to do a lesson, to do a problem, to do business, to do away with, to do gymnastics, to do exercises.","pg":78,"q":true},{"n":400,"title":"Lie এবং Lay.","dont":["I'm going to lay down for an hour.","Please lie the exam papers on the desk."],"say":["I'm going to lie down for an hour.","Please lay out the exam papers on the desk."],"note":"Lie (বিশ্রাম করা / শোয়া) হল intransitive verb এবং এটি কোনো object গ্রহণ করে না। Lay (রাখা / শোয়ানো) হল transitive verb এবং সর্বদা একটি object গ্রহণ করে। এদের প্রধান রূপগুলো হল যথাক্রমে lie, lay, lain এবং lay, laid, laid।\nNote: Lie (lied, lied) অর্থ মিথ্যা বলা, যেমন: He has lied to me. Lay (laid, laid) অর্থ ডিম পাড়াও হয়, যেমন: The hen has laid an egg. Lay the table বা lay the cloth অর্থ খাবারের জন্য টেবিল সাজানো।","pg":79,"q":true},{"n":401,"title":"Sit এবং Seat","dont":["Please seat down.","He sat himself near the fire."],"say":["Please sit down.","He seated himself near the fire."],"note":"Sit প্রধানত intransitive verb হিসেবে ব্যবহৃত হয়; seat হল transitive verb এবং এর একটি object প্রয়োজন হয়, যা বেশির ভাগ ক্ষেত্রে একটি reflexive pronoun, যেমন: He seated himself near the fire. এদের প্রধান রূপগুলো হল যথাক্রমে sit, sat, sat এবং seat, seated, seated।\nNote-1: Set-এর সাথে sit গুলিয়ে ফেলবেন না। Set (transitive) অর্থ কোনো জিনিস স্থাপন করা বা রাখা, যেমন: Set the lamp on the table. Intransitive হিসেবে set অর্থ (সূর্য বা তারা) অস্ত যাওয়া, যেমন: The sun has set.\nNote-2: Set সমেত প্রচলিত idiom: to set the table, to set on fire, to set off (out), to set in order, to set a trap, to set a clock, to set a price, to set your heart on, to set free, to set an example, to set a broken bone, to set to work (= কাজ শুরু করা)।","pg":79,"q":true},{"n":402,"title":"Rise এবং Raise","dont":["Val raises very early in the morning.","She rose their salaries too often."],"say":["Val rises very early in the morning.","She raised their salaries too often."],"note":"Rise একটি intransitive verb, যার অর্থ উপরে ওঠা, দাঁড়ানো বা ঘুম থেকে ওঠা (to go up, stand up, or get out of bed); এর কোনো object প্রয়োজন হয় না। Raise হল transitive verb এবং অর্থ হল কোনো কিছু উঠানো বা বাড়ানো (to lift up something)। এদের প্রধান রূপগুলো হল যথাক্রমে rise, rose, risen এবং raise, raised, raised।\nNote: Rise-এর পরিবর্তে arise-ও ব্যবহৃত হয়, তবে arise কেবল ‘উদ্ভূত হওয়া / শুরু হওয়া’ অর্থে ব্যবহার করাই ভালো, যেমন: A quarrel (a discussion, an argument, a difficulty, etc.) may arise.","pg":80,"q":true},{"n":404,"title":"Hanged এবং Hung","dont":["No-one has been hung in Britain since 1964.","We hanged the picture on the wall."],"say":["No-one has been hanged in Britain since 1964.","We hung the picture on the wall."],"note":"কোনো ব্যক্তিকে ফাঁসিতে ঝুলিয়ে মারা অর্থ বোঝালে hanged ব্যবহার করি; অন্যান্য ক্ষেত্রে রূপটি হয় hung। এদের প্রধান রূপগুলো হল যথাক্রমে hang, hanged, hanged এবং hang, hung, hung।","pg":80,"q":true},{"n":405,"title":"Stay এবং Remain","dont":["We remained in a very good hotel.","Not many figs have stayed on the tree."],"say":["We stayed in a very good hotel.","Not many figs have remained on the tree."],"note":"এখানে to stay অর্থ হল (অতিথি বা দর্শনার্থী হিসেবে স্বল্প) সময়ের জন্য কোথাও থাকা; আর to remain অর্থ হল (কিছু নেওয়া বা নষ্ট হওয়ার পরে) অবশিষ্ট থাকা।\nNote: একই জায়গায় বা অবস্থায় থেকে যাওয়া অর্থে দুটি verb-এর যে কোনোটিই ব্যবহৃত হতে পারে, যেমন: I shall stay (or remain) at home till tomorrow.\nসতর্কতা: “We remained in a very good hotel.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":81,"q":false},{"n":406,"title":"Wear এবং Put on.","dont":["Kathy always puts on black shoes.","I wear my clothes in the morning."],"say":["Kathy always wears black shoes.","I put on my clothes in the morning."],"note":"Wear অর্থ হল (পোশাক বা অলংকার) পরে থাকা — একটি অবস্থা। To put on (কাপড় পরা) একটি একক কাজকে নির্দেশ করে।\nNote: To dress-এর অর্থ to put on-এর মতোই, তবে dress-এর object হল ব্যক্তি, কোনো জিনিস নয়, যেমন: He dressed himself and went out; The mother dressed her baby.\nসতর্কতা: “Kathy always puts on black shoes.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":81,"q":false},{"n":407,"title":"Tear এবং Tear up.","dont":["John tore up his coat on a nail.","Philip was angry and tore the letter."],"say":["John tore his coat on a nail.","Philip was angry and tore up the letter."],"note":"To tear অর্থ হল (কখনও কখনও দুর্ঘটনাবশত) ছিঁড়ে ফেলা বা চিরে ফেলা; to tear up অর্থ হল ছিঁড়ে টুকরো টুকরো করে নষ্ট করা।\nNote: সম্পূর্ণতার ধারণা প্রকাশ করতে verb-এর সাথে প্রায়ই up যুক্ত হয়, যেমন: burn up, drink up, dry up, cut up, eat up, shut up, use up.","pg":81,"q":true},{"n":408,"title":"Grow এবং Grow up","dont":["These flowers grow up very quickly.","When I grow I’ll be a doctor."],"say":["These flowers grow very quickly.","When I grow up I’ll be a doctor."],"note":"To grow অর্থ হল বড় হওয়া / বৃদ্ধি পাওয়া; to grow up অর্থ হল প্রাপ্তবয়স্ক হওয়া।\nNote: Grow-এর অন্যান্য অর্থ: 1) জন্মানো / ফলা, যেমন: Rice grows in Egypt; 2) চাষ করা / জন্মানো, যেমন: We grow flowers in our garden; 3) রাখা / বাড়তে দেওয়া, যেমন: He grew a beard; 4) হয়ে ওঠা, যেমন: The nights grow cold in winter.","pg":82,"q":true},{"n":409,"title":"Pick এবং Pick up","dont":["We picked up flowers in the garden.","The naughty boy picked a stone."],"say":["We picked flowers in the garden.","The naughty boy picked up a stone."],"note":"To pick fruit or flowers অর্থ হল (আঙুল দিয়ে) ফল বা ফুল তোলা / ছেঁড়া; to pick up অর্থ হল (কোনো জিনিস) মাটি থেকে তুলে নেওয়া।\nসতর্কতা: “We picked up flowers in the garden.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":82,"q":false},{"n":410,"title":"Deal with এবং Deal in","dont":["This book deals in common errors.","A bookseller deals with books."],"say":["This book deals with common errors.","A bookseller deals in books."],"note":"To deal with অর্থ হল কোনো বিষয় নিয়ে আলোচনা করা / সংশ্লিষ্ট হওয়া; to deal in অর্থ হল কোনো কিছুর ব্যবসা (কেনা-বেচা) করা।\nNote: To deal with আরও অর্থ নির্দেশ করে: 1) লেনদেন করা, যেমন: I will not deal with that shopkeeper again; 2) কোনো বিষয়ের ব্যবস্থা নেওয়া, যেমন: The headmaster will deal with the question.","pg":82,"q":true},{"n":411,"title":"Interfere in এবং Interfere with","dont":["Don’t interfere with my private business!","Paul is always interfering in the equipment."],"say":["Don’t interfere in my private business!","Paul is always interfering with the equipment."],"note":"To interfere in অর্থ হল অন্যের ব্যাপারে নাক গলানো; to interfere with অর্থ হল কোনো জিনিস নিয়ে নাড়াচাড়া করা বা কোনো কিছুতে বাধা সৃষ্টি করা।","pg":83,"q":true},{"n":412,"title":"Borrow এবং Lend","dont":["I want to lend a book from you.","Will you please borrow me a book?"],"say":["I want to borrow a book from you.","Will you please lend me a book?"],"note":"To borrow অর্থ হল ধার নেওয়া এবং to lend অর্থ হল ধার দেওয়া।","pg":83,"q":true},{"n":413,"title":"Steal এবং Rob","dont":["Someone has robbed all her money.","Some men stole a bank last night."],"say":["Someone has stolen all her money.","Some men robbed a bank last night."],"note":"Steal (চুরি করা)-এর object হল সেই জিনিস যা চুরি হয়, যেমন: টাকা, ঘড়ি, সাইকেল ইত্যাদি। পক্ষান্তরে rob (ডাকাতি / লুট করা)-এর object হল সেই ব্যক্তি বা স্থান যার কাছ থেকে (বা যেখান থেকে) জিনিসটি নেওয়া হয়, যেমন: a man, a house বা a bank।","pg":83,"q":true},{"n":414,"title":"Revenge এবং Avenge","dont":["I avenged myself for the insult.","He now revenged his son’s murder."],"say":["I revenged myself for the insult.","He now avenged his son’s murder."],"note":"To revenge oneself হল নিজের প্রতি করা অন্যায়ের জন্য কাউকে শাস্তি দেওয়া; পক্ষান্তরে to avenge হল অন্যের (সাধারণত নিরীহ বা দুর্বলের) প্রতি করা অন্যায়ের প্রতিশোধ নেওয়া।\nNote: Revenge noun হিসেবে to take revenge on এবং to get or have one’s revenge — এই expression-গুলোতে ব্যবহৃত হয়, যেমন: He took revenge on the boy who had struck him; He could not rest until he had his revenge.\nসতর্কতা: আধুনিক ইংরেজিতে “I avenged myself for the insult.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":84,"q":false},{"n":415,"title":"Convince এবং Persuade","dont":["I am now persuaded of his honesty.","We could not convince him to play."],"say":["I am now convinced of his honesty.","We could not persuade him to play."],"note":"To convince হল কাউকে কোনো কিছু বিশ্বাস করানো; পক্ষান্তরে to persuade অর্থ হল কাউকে কিছু করতে রাজি করানো।\nNote: Persuaded-এর সাথে pursued গুলিয়ে ফেলবেন না। Pursued হল pursue (= to follow, অনুসরণ করা)-এর past tense।\nসতর্কতা: আধুনিক ইংরেজিতে “I am now persuaded of his honesty.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":84,"q":false},{"n":416,"title":"Refuse এবং Deny","dont":["Sarah denied to take the money.","John refused that he'd done it."],"say":["Sarah refused to take the money.","John denied that he'd done it."],"note":"To refuse অর্থ হল প্রস্তাবিত বা অনুরোধকৃত কোনো কিছু করতে বা নিতে অসম্মত হওয়া; to deny অর্থ হল কোনো কিছু সত্য বলে স্বীকার না করা বা অস্বীকার করা।","pg":84,"q":true},{"n":417,"title":"Discover এবং Invent","dont":["America was invented by Columbus.","Edison discovered the gramophone."],"say":["America was discovered by Columbus.","Edison invented the gramophone."],"note":"To discover হল আগে থেকেই অস্তিত্বমান কিন্তু অজানা কোনো কিছুকে খুঁজে পাওয়া; to invent হল আগে অস্তিত্বহীন কোনো কিছুকে তৈরি বা উদ্ভাবন করা।","pg":85,"q":true},{"n":418,"title":"Take place এবং Take part","dont":["The meeting will take part soon.","I’ll take place in the meeting."],"say":["The meeting will take place soon.","I’ll take part in the meeting."],"note":"To take place অর্থ হল- ঘটা বা অনুষ্ঠিত হওয়া, পক্ষান্তরে to take part অর্থ হল- কোন কিছুতে অংশ নেয়া।","pg":85,"q":true},{"n":419,"title":"Made from এবং Made of","dont":["Wine is made of grapes.","The statue is made from marble."],"say":["Wine is made from grapes.","The statue is made of marble."],"note":"তৈরি হওয়ার পরও উপাদানটি চেনা গেলে made of ব্যবহৃত হয় (যেমন মার্বেলের মূর্তি); তৈরি হওয়ার পর উপাদানটি আর আগের রূপে চেনা না গেলে made from ব্যবহৃত হয় (যেমন আঙুর থেকে মদ)।","pg":85,"q":true},{"n":420,"title":"Rent-এর পরিবর্তে Let","dont":["I let the house from Mr Jones.","I hired out a surf board when I was in America."],"say":["I rent the house from Mr Jones.","I hired a surf board when I was in America."],"note":"Landlord (বাড়ির মালিক) বাড়ি ভাড়া দেন (let বা rent), আর tenant (ভাড়াটে) বাড়ি ভাড়া নেন (rent)। অর্থাৎ let কেবল মালিকের ক্ষেত্রে এবং rent মালিক ও ভাড়াটে উভয়ের ক্ষেত্রে ব্যবহৃত হয়।\nNote: To hire হল অল্প সময়ের জন্য টাকা দিয়ে কোনো কিছু ব্যবহার করা, যেমন: to hire a bicycle, a car, a rowing-boat বা a concert hall for one evening। To hire out হল টাকার বিনিময়ে কাউকে কিছু ব্যবহার করতে দেওয়া, যেমন: He hires out bicycles by the hour.","pg":85,"q":true},{"n":421,"title":"Earn-এর পরিবর্তে Win","dont":["She wins her living by hard work."],"say":["She earns her living by hard work."],"note":"To earn অর্থ হল কাজের বিনিময়ে (কোনো কিছু) অর্জন বা উপার্জন করা; to win হল প্রতিযোগিতা, লড়াই, খেলা ইত্যাদির ফলাফল হিসেবে (কোনো কিছু) জয় করা।\nNote: To gain verb-টি দুটি অর্থেই ব্যবহৃত হতে পারে: to gain one’s living অথবা to gain a victory, a prize ইত্যাদি।","pg":86,"q":true},{"n":422,"title":"Replace with-এর পরিবর্তে substitute with ব্যবহার জনিত ভুল:","dont":["They substituted gold with paper money."],"say":["They replaced gold with paper money."],"note":"আমরা একটি জিনিস সরিয়ে তার জায়গায় অন্যটি দিই (replace A with B), কিন্তু একটির বিকল্প হিসেবে অন্যটি ব্যবহার করি (substitute B for A), যেমন: They replaced gold with paper money; They substituted paper money for gold.","pg":86,"q":true},{"n":423,"title":"Repair বা Mend-এর পরিবর্তে Correct","dont":["Some men are correcting the road."],"say":["Some men are repairing the road."],"note":"To correct হল কোনো কিছু নির্ভুল করা: to correct mistakes, a composition, a translation। To repair বা to mend হল নষ্ট হওয়া জিনিস মেরামত করে ভালো অবস্থায় ফিরিয়ে আনা: to repair বা mend a road, clothes, shoes ইত্যাদি।\nNote: To repair a watch হল ঘড়িটি মেরামত করা; তবে to correct a watch হল এতে সঠিক সময় মিলিয়ে দেওয়া।","pg":86,"q":true},{"n":424,"title":"Cover with dust-এর পরিবর্তে Dust","dont":["A sandstorm dusted our clothes."],"say":["A sandstorm covered our clothes with dust."],"note":"To dust অর্থ ধুলায় ঢেকে ফেলা নয়, বরং (কোনো কিছুকে) ধুলামুক্ত করা, যেমন: After sweeping, she dusted the furniture.","pg":86,"q":true},{"n":425,"title":"Ask বা Thank-এর পরিবর্তে Please","dont":["I pleased him to do me a favour.","I pleased him for his lovely present."],"say":["I asked him to do me a favour.","I thanked him for his lovely present."],"note":"To please অর্থ হল আনন্দ দেওয়া / খুশি করা, যেমন: I worked hard to please my teacher.","pg":86,"q":true},{"n":426,"title":"Was able to-এর পরিবর্তে Could","dont":["Because Laura worked hard she could finish the job in time."],"say":["Because Laura worked hard she was able to finish the job in time."],"note":"অতীতে কোনো কাজ করতে সফল হওয়া (managed to) বোঝালে was able to ব্যবহৃত হওয়া উচিত, could নয়।","pg":87,"q":true},{"n":427,"title":"Teach-এর পরিবর্তে learn ব্যবহার জনিত ভুল:","dont":["Graham learned us how to play hockey."],"say":["Graham taught us how to play hockey."],"note":"Teach অর্থ হল শিক্ষা দেওয়া বা শেখানো; learn অর্থ হল শেখা বা শিক্ষা গ্রহণ করা।","pg":87,"q":true},{"n":428,"title":"Beat-এর পরিবর্তে Win","dont":["We've always won your team."],"say":["We've always beaten your team."],"note":"To win হল চেষ্টা করে কোনো কিছু (পুরস্কার, খেলা ইত্যাদি) অর্জন করা; to beat হল প্রতিপক্ষকে পরাজিত করা, যেমন: The girls beat the boys, and won the prize। মনে রাখুন: এই verb-গুলোর প্রধান রূপ যথাক্রমে beat, beat, beaten এবং win, won, won।","pg":87,"q":true},{"n":429,"title":"Agree-এর পরিবর্তে Accept","dont":["The teacher accepted to go with us."],"say":["The teacher agreed to go with us."],"note":"Accept অর্থ সম্মতি জানিয়ে গ্রহণ করা, যেমন: I accepted his invitation; agree অর্থ (কোনো কিছু করতে) রাজি / সম্মত হওয়া, যেমন: He agreed to play। Accept-এর পরে infinitive বসে না।\nNote: ব্যক্তির ক্ষেত্রে agree with এবং প্রস্তাব বা পরিকল্পনার ক্ষেত্রে agree to, যেমন: I agree with Mr. A.S., but I cannot agree to this plan.","pg":87,"q":true},{"n":430,"title":"Let-এর পরিবর্তে Leave","dont":["Penny didn’t leave me to get my book."],"say":["Penny didn’t let me get my book."],"note":"Let অর্থ কিছু করতে অনুমতি দেওয়া; leave অর্থ কোনো কিছু ফেলে রাখা বা চলে যাওয়া, যেমন: Do you leave your books at school?","pg":87,"q":true},{"n":431,"title":"Take-এর পরিবর্তে Bring","dont":["The astronauts are bringing plants to the moon."],"say":["The astronauts are taking plants to the moon."],"note":"Bring বা take-এর ব্যবহার নির্ভর করে বক্তার অবস্থানের উপর। কোনো কিছু বক্তার কাছে নিয়ে আসা বোঝালে bring, আর বক্তার কাছ থেকে অন্য কোথাও নিয়ে যাওয়া বোঝালে take ব্যবহৃত হয়, যেমন: Take these cakes to your grandmother and bring (back) some flowers from her garden.\nNote: To fetch অর্থ গিয়ে কোনো কিছু নিয়ে আসা, যেমন: Please fetch me a glass of water (= গিয়ে এক গ্লাস পানি নিয়ে এসো)।","pg":88,"q":true},{"n":432,"title":"Sink-এর পরিবর্তে Drown","dont":["The ship drowned in the ocean."],"say":["The ship sank in the ocean."],"note":"To be drowned কেবল জীবিত প্রাণীর ক্ষেত্রে ব্যবহৃত হয় এবং অর্থ হল পানিতে ডুবে মারা যাওয়া (to die in water); to sink ব্যক্তি বা বস্তু উভয়ের ক্ষেত্রে ব্যবহৃত হয় এবং অর্থ হল পানির নিচে তলিয়ে যাওয়া (to go down to the bottom of water)।","pg":88,"q":true},{"n":433,"title":"Look-এর পরিবর্তে See","dont":["Neil was seeing out of the window."],"say":["Neil was looking out of the window."],"note":"To see হল চোখে পড়া বা দেখতে পাওয়া; to look হল দেখার উদ্দেশ্যে দৃষ্টি ফেরানো বা তাকানো, যেমন: I looked up and saw the aeroplane.","pg":88,"q":true},{"n":434,"title":"Listen-এর পরিবর্তে Hear","dont":["I was hearing her CDs."],"say":["I was listening to her CDs."],"note":"To listen হল মনোযোগ দিয়ে কোনো কিছু শোনা; to hear হল কোনো শব্দ কানে আসা বা শুনতে পাওয়া, যেমন: I heard them talking but I did not listen to what they said। To listen-এর আরেক অর্থ হল কারো কথা মেনে চলা বা উপদেশ গ্রহণ করা, যেমন: Denny always listens to his mother.","pg":88,"q":true},{"n":435,"title":"Remind-এর পরিবর্তে Remember","dont":["Please remember me to give it back."],"say":["Please remind me to give it back."],"note":"To remember হল মনে রাখা বা মনে থাকা, যেমন: I remember what you told me। To remind হল (কাউকে কিছু) মনে করিয়ে দেওয়া।","pg":88,"q":true},{"n":436,"title":"Let go-এর পরিবর্তে Leave","dont":["Leave the other end of the string."],"say":["Let go of the other end of the string."],"note":"ছেড়ে দেওয়া (let go) অর্থে leave (ছেড়ে চলে যাওয়া) ব্যবহৃত হতে পারে না। (See also section 430.)","pg":89,"q":true},{"n":437,"title":"Go to bed-এর পরিবর্তে Sleep","dont":["I’ll sleep early tonight."],"say":["I’ll go to bed early tonight."],"note":"To go to bed অর্থ হল ঘুমানোর জন্য বিছানায় যাওয়া। সুতরাং আমরা বলতে পারি: A person went to bed at nine o’clock, but he did not sleep until eleven o’clock. Then he slept soundly.\nNote: Go to sleep অর্থ হল ঘুমিয়ে পড়া, যেমন: He went to sleep while he was in the cinema.","pg":89,"q":true},{"n":438,"title":"Be-এর পরিবর্তে be found","dont":["The man was found in his office."],"say":["The man was in his office."],"note":"ইংরেজিতে be found সাধারণত ‘খুঁজে পাওয়া যাওয়া’ অর্থ নির্দেশ করে, যেমন: Diamonds are found in Africa and in India। সুতরাং He was found in his office বললে মনে হতে পারে যে লোকটি অফিসে লুকিয়ে ছিল এবং পরে তাকে খুঁজে পাওয়া গিয়েছিল।","pg":89,"q":true},{"n":439,"title":"Has-এর পরিবর্তে be with","dont":["My English book is with my brother."],"say":["My brother has my English book."],"note":"Have (কারো কাছে থাকা) অর্থে to be with ব্যবহার পরিহার করুন। Be with অর্থ হল কারো সঙ্গে থাকা, যেমন: He is with his parents.\nসতর্কতা: “My English book is with my brother.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":89,"q":false},{"n":440,"title":"Get (বা receive)-এর পরিবর্তে Take x","dont":["Clare took a good mark in chemistry."],"say":["Clare got a good mark in chemistry."],"note":"To take অর্থ হল ইচ্ছাকৃতভাবে বা শক্তি প্রয়োগ করে কোনো কিছু নেওয়া, যেমন: I took a book from the library; The army took the city। To get বা to receive অর্থ হল কারো দেওয়া কোনো কিছু পাওয়া, যেমন উপহার, চিঠি, টাকা বা পরীক্ষার নম্বর।","pg":89,"q":true},{"n":441,"title":"Want ইত্যাদির পরিবর্তে Like","dont":["Do you like to see my collection?"],"say":["Do you want to see my collection?"],"note":"Do you like to do something? অর্থ হল তুমি কি (অভ্যাসগতভাবে) এটা করতে পছন্দ করো? Do you want to do something? অর্থ হল তুমি কি এখন এটা করতে চাও?\nNote: তবে I would (I'd) like অর্থ হল আমি চাই (I want), যেমন: I'd like to play tennis today; Would you like to go for a walk with me?\nসতর্কতা: “Do you like to see my collection?” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":90,"q":false},{"n":442,"title":"Learn ইত্যাদির পরিবর্তে Know","dont":["Dan went to school to know English."],"say":["Dan went to school to learn English."],"note":"শেখার প্রক্রিয়া বোঝাতে learn ব্যবহৃত হয়; know ব্যবহৃত হয় শেখা সম্পন্ন হওয়ার পরের অবস্থা বোঝাতে, যেমন: She knows how to swim। একইভাবে find out (খুঁজে বের করা) বা realize (উপলব্ধি করা) অর্থে know ব্যবহার পরিহার করুন।","pg":90,"q":true},{"n":443,"title":"Study-এর পরিবর্তে Read","dont":["Lucy is reading algebra in her room."],"say":["Lucy is studying algebra in her room."],"note":"To study অর্থ হল শেখার চেষ্টা করা / অধ্যয়ন করা; to read এরূপ প্রচেষ্টা বোঝায় না। একজন ছাত্র ইংরেজি, গণিত, ইতিহাস ইত্যাদি study করে, কিন্তু একটি গল্প, চিঠি বা সংবাদপত্র read করে। তবে She is reading for a degree in commerce — এটি শুদ্ধ।","pg":90,"q":true},{"n":444,"title":"Study-এর পরিবর্তে Learn","dont":["Kevin is learning at Gordon College."],"say":["Kevin is studying at Gordon College."],"note":"I learn at (Gordon College, etc.) বলা ভুল; বলতে হবে: I study at (Gordon College, etc.) বা I am a student at (Gordon College, etc.).","pg":90,"q":true},{"n":445,"title":"Buy-এর পরিবর্তে Take","dont":["I went to the baker's to take bread."],"say":["I went to the baker's to buy bread."],"note":"Buy (কেনা) অর্থে কখনও take ব্যবহার করবেন না।","pg":90,"q":true},{"n":446,"title":"Take off-এর পরিবর্তে Take out","dont":["Chris took out his hat and coat."],"say":["Chris took off his hat and coat."],"note":"Note: Take off-এর বিপরীত হল put on।","pg":90,"q":true},{"n":448,"title":"Like-এর পরিবর্তে Sympathise","dont":["I don’t sympathise him very much."],"say":["I don't like him very much."],"note":"Sympathise, like-এর সমার্থক নয়। To sympathise with অর্থ হল অন্য কারো অনুভূতি (সাধারণত দুঃখ / বেদনা) ভাগ করে নেওয়া, অর্থাৎ সমবেদনা প্রকাশ করা, যেমন: I sympathise with you in your sorrow.","pg":91,"q":true},{"n":449,"title":"Keep-এর পরিবর্তে Put","dont":["Do you put your money in the bank?"],"say":["Do you keep your money in the bank?"],"note":"প্রায় স্থায়ীভাবে কোথাও রাখা বোঝাতে keep, আর সাময়িকভাবে রাখা বোঝাতে put ব্যবহার করা অপেক্ষাকৃত ভালো।\nসতর্কতা: “Do you put your money in the bank?” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":91,"q":false},{"n":450,"title":"Take care-এর পরিবর্তে care about, care for","dont":["Oliver cares about (cares for) his brother's investments."],"say":["Oliver takes care of his brother's investments."],"note":"Care about অর্থ হল কারো বা কোনো কিছুর ব্যাপারে চিন্তা / গুরুত্ব দেওয়া। Take care of অর্থ হল কারো দেখাশোনা করা (You should take care of your children) বা কোনো সমস্যার ব্যবস্থা নেওয়া (I think I should take care of that broken pane of glass)। Care for অর্থ হল সেবা-যত্ন করা (I cared for you when you were ill); এর আরেক অর্থ পছন্দ করা (William really cares for geraniums), যদিও এই ব্যবহার কিছুটা পুরোনো।\nNote: এমন অভিব্যক্তিগুলোও পরিহার করুন: (1) He doesn’t care for my advice, (2) He doesn’t care for his work, (3) He took no care of him, (4) No one cared for him during his illness. বলুন: (1) He pays no attention to my advice, (2) He takes no care over his work, (3) He took no notice of him, (4) No one took care of him during his illness.","pg":91,"q":true},{"n":451,"title":"Make (to force বাধ্য করা)-এর পরিবর্তে Let","dont":["The examiner let me sit quietly until everyone had finished."],"say":["The examiner made me sit quietly until everyone had finished."],"note":"Make অর্থ বাধ্য করা; এই অর্থে let ব্যবহৃত হতে পারে না।","pg":92,"q":true},{"n":452,"title":"Flowed-এর পরিবর্তে Flown","dont":["The river has flown over its banks."],"say":["The river has flowed over its banks."],"note":"Flown হল fly (উড়া)-এর past participle; flow (প্রবাহিত হওয়া)-এর past participle হল flowed। এদের প্রধান রূপগুলো যথাক্রমে fly, flew, flown এবং flow, flowed, flowed।\nNote: Flee (fled, fled) অর্থ পালিয়ে যাওয়া, যেমন: We flee from danger. Float (floated, floated) অর্থ পানি বা অন্য তরলের উপর ভেসে থাকা, যেমন: Ships float on the water.","pg":92,"q":true},{"n":453,"title":"Fell-এর পরিবর্তে Fall","dont":["John fall down and broke his leg."],"say":["John fell down and broke his leg."],"note":"এই verb-টির past tense হল fell, fall নয়; এর প্রধান রূপগুলো হল fall, fell, fallen।\nNote: Fell (felled, felled) একটি আলাদা verb, অর্থ কেটে ফেলা বা ধরাশায়ী করা, যেমন: They felled the tree.","pg":92,"q":true},{"n":454,"title":"Find-এর পরিবর্তে Found","dont":["Rosie tried to found her lost book."],"say":["Rosie tried to find her lost book."],"note":"To find হল বহুল প্রচলিত একটি verb, যার অর্থ হারানো জিনিস খুঁজে পাওয়া। এর প্রধান রূপগুলো হল find, found, found।\nNote: অবশ্য to found নামে আরেকটি verb আছে, যার অর্থ প্রতিষ্ঠা করা (to establish), যেমন: He founded the school fifty years ago.","pg":92,"q":true},{"n":455,"title":"Very এবং Too","dont":["It’s too hot in Rome in the summer.","It’s now very hot to play football."],"say":["It’s very hot in Rome in the summer.","It’s now too hot to play football."],"note":"Very সাধারণত adjective বা adverb-কে আরও জোরালো করে। Too অর্থ হল প্রয়োজনের তুলনায় বেশি, যার ফলে কোনো কিছু করা সম্ভব হয় না। It is too hot in the summer — বাক্যটি অসম্পূর্ণ: কী করার জন্য অতিরিক্ত গরম? যেমন too hot to play football। তবে কথ্য ইংরেজিতে কখনও কখনও এমন অসম্পূর্ণ phrase ব্যবহৃত হয়।\nসতর্কতা: কথ্য ইংরেজিতে “It’s too hot in Rome in the summer.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":93,"q":false},{"n":456,"title":"Very এবং Much:","dont":["He's a much strong man.","It’s a much interesting book.","He's very stronger than I am."],"say":["He's a very strong man.","It’s a very interesting book.","He's much stronger than I am."],"note":"Positive degree-এর adjective বা adverb এবং adjective হিসেবে ব্যবহৃত present participle (যেমন: interesting)-এর সাথে very ব্যবহৃত হয়। Comparative degree-এর adjective বা adverb এবং past participle-এর সাথে much ব্যবহৃত হয়।\nNote: Adjective অর্থে ব্যবহৃত কিছু past participle-এর পূর্বে very বসতে পারে, যেমন: I am very pleased to see you; I am very tired; The accommodation is very limited। তবে I was much (very নয়) afraid of falling.","pg":93,"q":true},{"n":457,"title":"Very much-এর পরিবর্তে too much ব্যবহার জনিত ভুল:","dont":["She likes the cinema too much.","He’s too much stronger than I am."],"say":["She likes the cinema very much.","He’s very much stronger than I am."],"note":"Much-এর চেয়ে বেশি জোর দিতে very much ব্যবহৃত হয়। Too much অতিরিক্ত পরিমাণ বা মাত্রা নির্দেশ করে, যেমন: She ate too much, and felt ill.\nNote: Work, try, rain, think, to be hurt, to be injured-এর মতো কিছু verb-এর সাথে much বা very much ব্যবহৃত হয় না। সুতরাং বলুন: He works very hard; He was badly hurt; He was seriously injured.","pg":94,"q":true},{"n":458,"title":"Ago-এর পরিবর্তে before ব্যবহার জনিত ভুল:","dont":["I saw your friend before two weeks."],"say":["I saw your friend two weeks ago."],"note":"কথা বলার মুহূর্ত থেকে অতীতের দিকে সময় হিসাব করতে ago ব্যবহৃত হয়, যেমন: half an hour ago, three days ago, four months ago, five years ago, a long time ago। অতীতের কোনো একটি সময়-বিন্দু থেকে আরও পেছনের দিকে হিসাব করতে before ব্যবহৃত হয়, যেমন: Napoleon died in 1821; he had lost the battle of Waterloo six years before.\nNote: Ago ব্যবহৃত হলে verb past tense-এ হয়, যেমন: He came five minutes ago.","pg":94,"q":true},{"n":459,"title":"Hard-এর পরিবর্তে hardly ব্যবহার জনিত ভুল:","dont":["She rubbed her eyes hardly."],"say":["She rubbed her eyes hard."],"note":"Hard অর্থ জোরে / কঠোরভাবে। Hardly অর্থ প্রায় না বা কোনো রকমে, যেমন: The baby can hardly walk.","pg":94,"q":true},{"n":460,"title":"Not very-এর পরিবর্তে not so ব্যবহার জনিত ভুল:","dont":["I hear that he’s not so rich."],"say":["I hear that he’s not very rich."],"note":"‘তেমন / খুব নয়’ (not very) অর্থে not so ব্যবহৃত হতে পারে না। He is not so rich অভিব্যক্তিটি একটি তুলনা ইঙ্গিত করে, যেমন: He is not so rich as you are.\nসতর্কতা: আধুনিক ইংরেজিতে “I hear that he’s not so rich.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":94,"q":false},{"n":461,"title":"Presently ইত্যাদির পরিবর্তে just now ব্যবহার জনিত ভুল:","dont":["The messenger will arrive just now."],"say":["The messenger will arrive presently."],"note":"নিকট ভবিষ্যতের কথা বললে আমরা অবশ্যই presently, immediately বা soon ব্যবহার করব। Just now বর্তমান ও সাম্প্রতিক অতীতকে নির্দেশ করে, ভবিষ্যৎকে নয়, যেমন: He's not at home just now (এই মুহূর্তে); He left just now (অল্প সময় আগে)।","pg":95,"q":true},{"n":462,"title":"At present-এর পরিবর্তে presently ব্যবহার জনিত ভুল:","dont":["His uncle is in London presently."],"say":["His uncle is in London at present."],"note":"At present এবং presently সমার্থক নয় (British English-এ)। At present অর্থ হল এখন; presently অর্থ হল শীঘ্রই, যেমন: She will come back presently (= soon)।\nসতর্কতা: American English-এ “His uncle is in London presently.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":95,"q":false},{"n":463,"title":"Rarely-এর পরিবর্তে scarcely ব্যবহার জনিত ভুল:","dont":["Zoe scarcely comes to see me now."],"say":["Zoe rarely comes to see me now."],"note":"Scarcely, rarely-এর সমার্থক নয়। Rarely অর্থ হল কালেভদ্রে বা মাঝে মাঝে; scarcely অর্থ হল প্রায় না বা কোনো রকমে, যেমন: I had scarcely finished when he came.","pg":95,"q":true},{"n":464,"title":"Late-এর পরিবর্তে lately ব্যবহার জনিত ভুল:","dont":["Last night I went to bed lately."],"say":["Last night I went to bed late."],"note":"Early-এর বিপরীত হল late, lately নয়। Lately অর্থ হল সম্প্রতি, যেমন: I haven't seen him lately.","pg":95,"q":true},{"n":465,"title":"Many এবং Much","dont":["My brother hasn’t much books.","Is there many dust in the room?"],"say":["My brother hasn’t many books.","Is there much dust in the room?"],"note":"Many countable noun (যা গোনা যায়)-এর সাথে এবং much uncountable noun-এর সাথে ব্যবহৃত হয়।\nNote: Affirmative বাক্যে many এবং much সাধারণত a lot (of), a great deal (of), plenty (of), a good deal (of), a good many, a great number (of), a large quantity (of) ইত্যাদি দ্বারা প্রতিস্থাপিত হয়।","pg":95,"q":true},{"n":466,"title":"Few এবং A Few","dont":["Although the question was easy, a few boys were able to answer it.","Although the question was difficult, few boys were able to answer it."],"say":["Although the question was easy, few boys were able to answer it.","Although the question was difficult, a few boys were able to answer it."],"note":"Few অর্থ হল বেশি নয় / প্রায় কেউ না — সংখ্যার স্বল্পতার উপর জোর দেয় (নেতিবাচক অর্থ)। A few অর্থ হল অন্তত কিছু সংখ্যক (ইতিবাচক অর্থ)।","pg":96,"q":true},{"n":468,"title":"Each এবং Every","dont":["She gave an apple to every of the children.","Every of the children had an apple."],"say":["She gave an apple to each of the children.","Every child had an apple."],"note":"Each দুই বা ততোধিক ব্যক্তি বা বস্তুর ক্ষেত্রে ব্যবহৃত হয় এবং এক এক করে প্রত্যেককে বোঝায়; every কখনও দু’জনের জন্য ব্যবহৃত হয় না, সর্বদা দু’য়ের অধিক ব্যক্তি বা বস্তুকে একটি দল হিসেবে বোঝায়। Each অপেক্ষাকৃত স্বতন্ত্র ও সুনির্দিষ্ট, আর every অপেক্ষাকৃত জোরালো। Every-এর পরে of বসে না (every one of বসতে পারে)।\nNote: Each এবং every সর্বদাই singular, যেমন: Each (or every) one of the twenty boys has a book.","pg":96,"q":true},{"n":469,"title":"His এবং Her","dont":["John visits her aunt every Sunday.","Ann visits his uncle every Sunday."],"say":["John visits his aunt every Sunday.","Ann visits her uncle every Sunday."],"note":"ইংরেজিতে possessive adjective (এবং pronoun) মিলে যায় মালিকের (possessor) সাথে, অধিকৃত ব্যক্তি বা বস্তুর সাথে নয়। মালিক পুরুষ হলে his এবং নারী হলে her ব্যবহার করতে হয়।","pg":97,"q":true},{"n":470,"title":"Older (oldest) এবং Elder (eldest)","dont":["This girl is elder than that one."],"say":["This girl is older than that one.","My elder brother is called John."],"note":"Older এবং oldest ব্যক্তি বা বস্তু উভয়ের ক্ষেত্রে ব্যবহৃত হয়; পক্ষান্তরে elder এবং eldest কেবল ব্যক্তির ক্ষেত্রে, প্রধানত একই পরিবারের সদস্যদের ক্ষেত্রে ব্যবহৃত হয় (my elder brother, my eldest sister)।\nNote: সতর্কতা: elder-এর পরে than বসে না, যেমন: Jane is older (not elder) than her sister.","pg":97,"q":true},{"n":472,"title":"Wounded এবং Injured বা Hurt","dont":["Thousands were injured in the war.","Jack was wounded in a car accident."],"say":["Thousands were wounded in the war.","Jack was injured in a car accident."],"note":"লোকজন দুর্ঘটনায় injured বা hurt (আহত) হয় এবং যুদ্ধে বা অস্ত্রের আঘাতে wounded (আহত) হয়। (এদের noun-গুলো হল injury এবং wound)\nসতর্কতা: আধুনিক ইংরেজিতে “Thousands were injured in the war.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":98,"q":false},{"n":473,"title":"Farther এবং Further","dont":["New York is further than London.","I shall get farther information."],"say":["New York is farther than London.","I shall get further information."],"note":"Note: Farther অর্থ ‘অপেক্ষাকৃত দূরবর্তী’ এবং further অর্থ ‘অতিরিক্ত / আরও’। অবশ্য বর্তমানে দূরত্ব বোঝাতেও further বহুলভাবে ব্যবহৃত হয়।\nসতর্কতা: আধুনিক ইংরেজিতে “New York is further than London.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":98,"q":false},{"n":474,"title":"An-এর পরিবর্তে A","dont":["I waited for a hour.","He is an European."],"say":["I waited for an hour.","He is a European."],"note":"Vowel ধ্বনি বা উচ্চারিত না হওয়া h দিয়ে শুরু শব্দের (যেমন: hour, heir, honest) পূর্বে a-এর পরিবর্তে an ব্যবহৃত হয়। তবে ‘ইউ’ (y) ধ্বনি দিয়ে শুরু শব্দের পূর্বে a বসে, যেমন: a European, a university (কিন্তু an uncle)।","pg":98,"q":true},{"n":475,"title":"A (an)-এর পরিবর্তে One","dont":["Adam found one ring in the street."],"say":["Adam found a ring in the street."],"note":"A বা an-এর পরিবর্তে one কেবল তখনই ব্যবহৃত হয় যখন সংখ্যার উপর জোর দেওয়া হয়, যেমন: He gave me one book instead of two.","pg":98,"q":true},{"n":476,"title":"Any-এর পরিবর্তে Some","dont":["Have you some lesson to prepare?"],"say":["Have you any lesson to prepare?"],"note":"Or: Have you any lessons to prepare?\nSome সাধারণত affirmative বাক্যে এবং any interrogative ও negative বাক্যে ব্যবহৃত হয়। তবে প্রস্তাব বা অনুরোধে প্রশ্নেও some ব্যবহৃত হয়, যেমন: Would you like some soup?","pg":99,"q":true},{"n":477,"title":"Less-এর পরিবর্তে Fewer","dont":["They have less books than I have."],"say":["They have fewer books than I have."],"note":"Less পরিমাণ বা মাত্রা নির্দেশ করে, fewer সংখ্যা নির্দেশ করে। সুতরাং less water, less food, less money, less education, কিন্তু fewer books, fewer letters, fewer friends।\nNote: আমরা বলি less than five (six etc.) pounds, কারণ এখানে pound অর্থের পরিমাণ হিসেবে বিবেচিত হয়, মুদ্রার সংখ্যা হিসেবে নয়।","pg":99,"q":true},{"n":478,"title":"That-এর পরিবর্তে This","dont":["Look at this dog across the street!"],"say":["Look at that dog across the street!"],"note":"কাছের কিছু (যা আপনি ছুঁতে পারেন বা সময়ের দিক থেকে খুব সাম্প্রতিক) বোঝাতে this ব্যবহৃত হয়; দূরের কিছু (স্থান বা সময়ের দিক থেকে) বোঝাতে that ব্যবহৃত হয়। রাস্তার ওপারের কুকুরটি দূরে, তাই that।","pg":99,"q":true},{"n":479,"title":"Later-এর পরিবর্তে latter ব্যবহার জনিত ভুল:","dont":["She got to school latter than I did."],"say":["She got to school later than I did."],"note":"Later সময় নির্দেশ করে; latter ক্রম নির্দেশ করে এবং দুটি বস্তু (বা ব্যক্তি)-র মধ্যে পরে উল্লিখিতটিকে বোঝায়, যেমন: Alexandria and Cairo are large cities; the latter has a population of over a million। Latter-এর বিপরীত হল former।","pg":99,"q":true},{"n":480,"title":"Latter-এর পরিবর্তে Last","dont":["Sir Walter Scott and Charles Dickens are both excellent writers, but I prefer the last."],"say":["Sir Walter Scott and Charles Dickens are both excellent writers, but I prefer the latter."],"note":"The latter অর্থ হল দুটির মধ্যে শেষে উল্লিখিতটি; the last দু’য়ের অধিক ব্যক্তি বা বস্তুর সারির শেষটিকে নির্দেশ করে।","pg":100,"q":true},{"n":481,"title":"Latest-এর পরিবর্তে Last","dont":["What's the last news from the Palace?"],"say":["What's the latest news from the Palace?"],"note":"Latest অর্থ হল সর্বশেষ / হালনাগাদ; last হল ক্রমের শেষেরটি, যেমন: Z is the last letter of the alphabet.","pg":100,"q":true},{"n":482,"title":"Young-এর পরিবর্তে small ও old-এর পরিবর্তে big ব্যবহার জনিত ভুল:","dont":["I'm two years smaller than you."],"say":["I'm two years younger than you."],"note":"বয়সের উল্লেখ থাকলে young বা old বলুন, যেমন: She's three years older than me। Small এবং big সাধারণত আকার নির্দেশ করে, যেমন: He is big (or small) for his age.\nNote: Great ব্যক্তি বা বস্তুর গুরুত্ব নির্দেশ করে, যেমন: Napoleon was a great man; Homer's Iliad is a great book. Distance, height, length, depth-এর মতো noun-এর সাথেও great ব্যবহৃত হয়, যেমন: There is a great distance between the earth and the moon.","pg":100,"q":true},{"n":483,"title":"Tall-এর পরিবর্তে high ব্যবহার জনিত ভুল:","dont":["My elder brother is six feet high."],"say":["My elder brother is six feet tall."],"note":"Tall সাধারণত মানুষের উচ্চতা বোঝায় এবং এটি short-এর বিপরীত। High ব্যবহৃত হয় পর্বত, দেয়াল ইত্যাদির ক্ষেত্রে এবং এটি low-এর বিপরীত। (গাছ ও ভবনের ক্ষেত্রে tall এবং high দুটোই চলে।)","pg":100,"q":true},{"n":484,"title":"Handsome বা Good-looking-এর পরিবর্তে beautiful ব্যবহার জনিত ভুল:","dont":["He's grown into a beautiful young man."],"say":["He's grown into a handsome young man."],"note":"আমরা সাধারণত বলি একজন পুরুষ handsome বা good-looking, এবং একজন নারী beautiful, lovely, good-looking বা pretty।","pg":100,"q":true},{"n":485,"title":"Ill-এর পরিবর্তে sick ব্যবহার জনিত ভুল:","dont":["He's been sick for over a year."],"say":["He's been ill for over a year."],"note":"To be ill অর্থ হল অসুস্থ বা পীড়িত হওয়া। British English-এ to be sick সাধারণত বমি করা বা বমি বমি ভাব বোঝায়, যেমন: The smell made me sick. (American English-এ sick অর্থ ill-ও হয়।)\nNote: Sick একটি noun-এর পূর্বে বা plural অর্থে noun হিসেবেও ব্যবহৃত হতে পারে, যেমন: The sick man is lying in bed; We visit the sick। কিন্তু ill এভাবে ব্যবহৃত হয় না।\nসতর্কতা: American English-এ “He's been sick for over a year.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":101,"q":false},{"n":486,"title":"Clean-এর পরিবর্তে Clear","dont":["You should keep your hands clear."],"say":["You should keep your hands clean."],"note":"Clean-এর বিপরীত হল dirty। Clear অর্থ স্বচ্ছ বা পরিষ্কার (দেখা যায় এমন), যেমন: clear water, a clear sky.\nসতর্কতা: “You should keep your hands clear.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":101,"q":false},{"n":487,"title":"Sorry-এর পরিবর্তে Angry","dont":["I was angry to hear of her death."],"say":["I was sorry to hear of her death."],"note":"Sorry-এর বিপরীত হল glad। Angry অর্থ রাগান্বিত, যেমন: He was angry when a boy hit him in the face.","pg":101,"q":true},{"n":488,"title":"Angry-এর পরিবর্তে nervous ব্যবহার জনিত ভুল:","dont":["Our teacher is very nervous today."],"say":["Our teacher is very angry today."],"note":"Nervous অর্থ হল সহজে উত্তেজিত বা ভীত হওয়া / উদ্বিগ্ন; এটি angry (রাগান্বিত) অর্থে ব্যবহৃত হতে পারে না।\nসতর্কতা: “Our teacher is very nervous today.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":101,"q":false},{"n":489,"title":"House এবং Home","dont":["You should go to your house now."],"say":["You should go home now."],"note":"নিজের বাড়ি বোঝাতে my house, his house, your house ইত্যাদি না বলে প্রায়ই home বলা উচিত। House হল যে কোনো বসবাসের ভবন (যেমন: Many new houses have been built), আর home হল সেই নির্দিষ্ট বাড়ি যেখানে কেউ বাস করে।\nNote: Home কারো নিজের দেশকেও বোঝাতে পারে। কোনো ইংরেজ যখন বলেন I’m going home this summer, তার অর্থ তিনি ইংল্যান্ডে যাচ্ছেন।","pg":102,"q":true},{"n":490,"title":"Story এবং History","dont":["She told me an interesting history.","We study the story of the Romans."],"say":["She told me an interesting story.","We study the history of the Romans."],"note":"Story হল ঘটনাবলির একটি বিবরণ, যা সত্য হতে পারে বা না-ও হতে পারে। History হল অতীত ঘটনাবলির প্রামাণ্য বিবরণ বা ইতিহাস।","pg":102,"q":true},{"n":491,"title":"Habit এবং Custom","dont":["Telling lies is a very bad custom.","The Chinese have strange habits."],"say":["Telling lies is a very bad habit.","The Chinese have strange customs."],"note":"Habit একজন ব্যক্তির অভ্যাস নির্দেশ করে, কিন্তু custom একটি সমাজ, জাতি বা দেশের প্রথা।","pg":102,"q":true},{"n":492,"title":"Cause of এবং Reason for","dont":["What's the reason for a sandstorm?","You have a good cause of coming."],"say":["What's the cause of a sandstorm?","You have a good reason for coming."],"note":"Cause হল যা কোনো ফলাফল সৃষ্টি করে (কারণ); reason হল যা কোনো কাজ বা ফলাফলকে ব্যাখ্যা বা যৌক্তিক করে (যুক্তি)।","pg":103,"q":true},{"n":493,"title":"Scene এবং Scenery","dont":["The TV crew arrived at the scenery.","The scene in Cyprus is beautiful."],"say":["The TV crew arrived at the scene.","The scenery in Cyprus is beautiful."],"note":"Scene একটি নির্দিষ্ট স্থান বা ঘটনাস্থলকে নির্দেশ করে; scenery একটি অঞ্চলের প্রাকৃতিক দৃশ্যের সামগ্রিক রূপকে নির্দেশ করে। Scenery plural অর্থে ব্যবহৃত হয় না।","pg":103,"q":true},{"n":494,"title":"Centre এবং Middle","dont":["Stand in the middle of the circle.","He was in the centre of the street."],"say":["Stand in the centre of the circle.","He was in the middle of the street."],"note":"Centre হল একটি নির্দিষ্ট বিন্দু (কেন্দ্র); middle হল কেন্দ্রের চারপাশের বা কাছাকাছি অনির্দিষ্ট স্থান (মাঝখান)।\nসতর্কতা: “Stand in the middle of the circle.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":103,"q":false},{"n":496,"title":"Customer এবং Client","dont":["That grocer has plenty of clients.","That lawyer has plenty of customers."],"say":["That grocer has plenty of customers.","That lawyer has plenty of clients."],"note":"দোকানের ক্রেতা হল customer; আইনজীবী, ব্যাংক ইত্যাদির সেবা গ্রহণকারী হল client।","pg":104,"q":true},{"n":497,"title":"Guest-এর পরিবর্তে stranger ব্যবহার জনিত ভুল:","dont":["They had some strangers last night."],"say":["They had some guests last night."],"note":"Guest হচ্ছেন পরিচিত বা বন্ধুস্থানীয় কেউ, যিনি আমাদের বাড়িতে বেড়াতে এসেছেন; stranger হচ্ছেন অপরিচিত একজন ব্যক্তি।\nNote: Foreigner হলেন অন্য দেশের নাগরিক, যিনি সাধারণত অন্য ভাষায় কথা বলেন।","pg":104,"q":true},{"n":498,"title":"Journey-এর পরিবর্তে travel ব্যবহার জনিত ভুল:","dont":["Our travel to Wales was lovely."],"say":["Our journey to Wales was lovely."],"note":"Travel মূলত verb, যা এক স্থান থেকে অন্য স্থানে যাতায়াত বোঝায়; journey হল noun (যাত্রা)। সংক্ষিপ্ত journey-এর ক্ষেত্রে আমরা (take a) trip ব্যবহার করি: We took a trip to the seaside last Sunday। Travelling-ও noun হিসেবে ব্যবহৃত হতে পারে।\nNote: Travel noun হিসেবে ব্যবহৃত হয়: 1) সাধারণ অর্থে, যেমন: She loves travel; 2) plural-এ, যেমন: He has written a book about his travels.","pg":104,"q":true},{"n":499,"title":"Leg-এর পরিবর্তে foot ব্যবহার জনিত ভুল:","dont":["I hurt my foot. (যখন আঘাতটি গোড়ালির উপরে)"],"say":["I hurt my leg."],"note":"Leg হল ঊরু থেকে গোড়ালি পর্যন্ত শরীরের অংশ এবং foot হল গোড়ালির নিচের অংশ (পায়ের পাতা)। একইভাবে hand এবং arm-কেও আলাদা রাখতে হবে।\nNote: চেয়ার, টেবিল, খাট ইত্যাদির leg (পায়া) হয়; লক্ষণীয়, পাহাড়, দেয়াল, মই, পৃষ্ঠা ইত্যাদির foot (পাদদেশ বা নিচের অংশ) হয়।","pg":104,"q":false},{"n":500,"title":"Toe-এর পরিবর্তে finger ব্যবহার জনিত ভুল:","dont":["I hurt a finger of my right foot."],"say":["I hurt a toe of my right foot."],"note":"হাতের আঙুলগুলো হল fingers এবং পায়ের আঙুলগুলো হল toes।","pg":105,"q":true},{"n":501,"title":"Poem-এর পরিবর্তে poetry ব্যবহার জনিত ভুল:","dont":["I have a poetry to learn by heart."],"say":["I have a poem to learn by heart."],"note":"Poetry হল সামগ্রিকভাবে কবিতা (সাহিত্যের একটি রূপ, uncountable); poem হল একটি একক কবিতা।","pg":105,"q":true},{"n":502,"title":"Play-এর পরিবর্তে theatre ব্যবহার জনিত ভুল:","dont":["Sarah is going to see a theatre tonight."],"say":["Sarah is going to see a play tonight."],"note":"Theatre হল সেই ভবন যেখানে নাটক মঞ্চস্থ হয়; এটি নিজে play (নাটক) নয়।","pg":105,"q":true},{"n":503,"title":"Game-এর পরিবর্তে play ব্যবহার জনিত ভুল:","dont":["They had a nice play of football."],"say":["They had a nice game of football."],"note":"Game অর্থে play ব্যবহার করা পরিহার করুন। Play অর্থ নাটক, অথবা সাধারণ অর্থে খেলাধুলা / আমোদ, যেমন: He is fond of play.","pg":105,"q":true},{"n":504,"title":"Clothes / suit-এর পরিবর্তে dress ব্যবহার জনিত ভুল:","dont":["My elder brother has a new dress."],"say":["My elder brother has a new suit."],"note":"মেয়ে এবং মহিলারা dress পরে, ছেলে এবং পুরুষেরা suit পরে। Clothes দিয়ে dress বা suit যে কোনোটিকে বোঝানো যায়, যেমন: John (or Mary) is wearing new clothes.\nNote: তবে আমরা বলতে পারি: a man in full evening dress বা morning dress ইত্যাদি।","pg":105,"q":true},{"n":505,"title":"Person / People-এর পরিবর্তে individual ব্যবহার জনিত ভুল:","dont":["There were five individuals in the shop."],"say":["There were five people in the shop."],"note":"দল বা সমাজের বিপরীতে একক ব্যক্তিকে বোঝাতে individual ব্যবহৃত হয়: The individual must act for the good of the community.\nসতর্কতা: “There were five individuals in the shop.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":105,"q":false},{"n":506,"title":"People-এর পরিবর্তে men ব্যবহার জনিত ভুল:","dont":["All the streets were full of men."],"say":["All the streets were full of people."],"note":"সাধারণভাবে মানুষ বোঝাতে people ব্যবহার করুন, men নয়।\nসতর্কতা: “All the streets were full of men.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":106,"q":false},{"n":507,"title":"Wife-এর পরিবর্তে woman ব্যবহার জনিত ভুল:","dont":["The man took his woman with him."],"say":["The man took his wife with him."],"note":"","pg":106,"q":true},{"n":509,"title":"Wind-এর পরিবর্তে air ব্যবহার জনিত ভুল:","dont":["The strong air blew her hat away."],"say":["The strong wind blew her hat away."],"note":"","pg":106,"q":true},{"n":510,"title":"Floor-এর পরিবর্তে ground ব্যবহার জনিত ভুল:","dont":["When I entered the room, I saw a book on the ground."],"say":["When I entered the room, I saw a book on the floor."],"note":"","pg":106,"q":true},{"n":511,"title":"Room-এর পরিবর্তে place ব্যবহার জনিত ভুল:","dont":["Is there place for me on the bus?"],"say":["Is there room for me on the bus?"],"note":"খালি জায়গা (unoccupied space) অর্থে room ব্যবহৃত হয়, place নয়।","pg":106,"q":true},{"n":512,"title":"Instrument-এর পরিবর্তে organ ব্যবহার জনিত ভুল:","dont":["What other organ can you play?"],"say":["What other instrument can you play?"],"note":"Organ একটি নির্দিষ্ট বাদ্যযন্ত্র, যা কিছু গির্জায় স্তোত্র গানের সাথে বাজানো হয়। অন্য কোনো বাদ্যযন্ত্র বোঝাতে organ ব্যবহার করবেন না; সাধারণভাবে বলুন instrument।","pg":107,"q":true},{"n":514,"title":"Advice","dont":["Nick gave me some good advices."],"say":["Nick gave me some good advice."],"note":"Advice একটি uncountable noun; এর plural হয় না।\nNote: একটি মাত্র উপদেশ বোঝাতে বলুন: a piece of advice, যেমন: He gave me a useful piece of advice.","pg":107,"q":true},{"n":515,"title":"Information","dont":["Can you give me any informations?"],"say":["Can you give me any information?"],"note":"Information একটি uncountable noun; এর plural হয় না।\nNote: একটি মাত্র তথ্য বোঝাতে বলুন: an item বা a bit (piece) of information, যেমন: He gave me a useful item of information.","pg":107,"q":true},{"n":516,"title":"Furniture","dont":["All the furnitures were old."],"say":["All the furniture was old."],"note":"Furniture একটি uncountable noun, যা সর্বদা singular verb এবং pronoun গ্রহণ করে। একটি মাত্র আসবাব বোঝাতে বলুন: a piece of furniture।","pg":107,"q":true},{"n":517,"title":"Luggage","dont":["Her luggages are at the station."],"say":["Her luggage is at the station."],"note":"Note: Luggage-এর জন্য ব্যবহৃত অন্য একটি শব্দ হল baggage; এদের কোনোটিরই plural হয় না, যেমন: The baggage is ready for the train.","pg":108,"q":true},{"n":518,"title":"Damage","dont":["The fire caused many damages."],"say":["The fire caused much damage."],"note":"Note: Plural রূপ damages অর্থ ক্ষতিপূরণ হিসেবে আদালতের নির্ধারিত অর্থ, যেমন: The court ordered him to pay damages.","pg":108,"q":true},{"n":520,"title":"Character","dont":["The school builds good characters."],"say":["The school builds good character."],"note":"Note: Plural রূপ characters বর্ণমালার অক্ষর বা উপন্যাস / নাটকের চরিত্রগুলোকে নির্দেশ করে।","pg":108,"q":true},{"n":521,"title":"Hair","dont":["That man has long hairs."],"say":["That man has long hair."],"note":"Note: তবে একক চুল (strand) বোঝাতে hair countable এবং plural রূপ hairs হয়, যেমন: I found two long hairs in my food.","pg":108,"q":true},{"n":522,"title":"Bread","dont":["Breads are sold at the baker's."],"say":["Bread is sold at the baker's."],"note":"Note: তবে আমরা বলতে পারি a loaf of bread এবং loaves of bread, যেমন: I bought a loaf (two, three, etc., loaves) of bread.","pg":108,"q":true},{"n":523,"title":"Fish","dont":["Yesterday we had fishes for dinner."],"say":["Yesterday we had fish for dinner."],"note":"Note: খাদ্য হিসেবে বা সাধারণভাবে অনেক মাছ বোঝালে fish সর্বদা singular। Plural রূপ fishes এখন কদাচিৎ ব্যবহৃত হয় এবং বিভিন্ন প্রজাতির মাছকে আলাদাভাবে বোঝায়।","pg":108,"q":true},{"n":524,"title":"Fruit","dont":["We didn’t have many fruits this summer."],"say":["We didn’t have much fruit this summer."],"note":"Note: Plural রূপ fruits কদাচিৎ ব্যবহৃত হয় এবং বিভিন্ন প্রকারের ফল বোঝায়, যেমন: Cyprus produces oranges, apricots, and other fruits.","pg":108,"q":true},{"n":525,"title":"Grass","dont":["The dog lay down on the grasses."],"say":["The dog lay down on the grass."],"note":"","pg":109,"q":true},{"n":526,"title":"Dozen","dont":["I want to buy three dozens eggs."],"say":["I want to buy three dozen eggs."],"note":"Note: Dozen-এর পূর্বে কোনো সংখ্যা (যেমন three) বা a না থাকলে plural রূপ ব্যবহৃত হয়, যেমন: There were dozens of eggs.","pg":109,"q":true},{"n":527,"title":"Hundred ইত্যাদি","dont":["The town has fifty thousands people."],"say":["The town has fifty thousand people."],"note":"Note: Hundred, thousand এবং million-এর পূর্বে কোনো সংখ্যা বা a না থাকলে এরা plural রূপ নেয়, যেমন: Thousands of people were present.","pg":109,"q":true},{"n":528,"title":"Sheep","dont":["Ten sheeps are grazing in the field."],"say":["Ten sheep are grazing in the field."],"note":"Note: Sheep, deer, salmon এবং আরও কিছু noun-এর singular এবং plural রূপ একই। সুতরাং বলুন one sheep বা ten sheep।","pg":109,"q":true},{"n":529,"title":"Knowledge","dont":["Karen has good knowledges of history."],"say":["Karen has a good knowledge of history."],"note":"","pg":109,"q":true},{"n":530,"title":"Progress","dont":["Tom has made great progresses."],"say":["Tom has made great progress."],"note":"","pg":109,"q":true},{"n":531,"title":"Thunder এবং Lightning.","dont":["There were thunders and lightnings."],"say":["There was thunder and lightning."],"note":"Note: যখন কেবল একটি মাত্র ঘটনা বুঝানো হয়, আমরা বলি- a clap of thunder এবং a flash or bolt of lightning.","pg":109,"q":true},{"n":532,"title":"Machinery","dont":["They're now using new machineries."],"say":["They’re now using new machinery."],"note":"Note: Machinery একটি uncountable noun এবং সর্বদা singular verb ও pronoun গ্রহণ করে। তবে আমরা বলতে পারি: a piece of machinery বা pieces of machinery.","pg":110,"q":true},{"n":533,"title":"Mathematics ইত্যাদি + singular verb","dont":["Mathematics are not easy to learn."],"say":["Mathematics is not easy to learn."],"note":"Note: -ics দিয়ে শেষ হওয়া বিজ্ঞান ও বিষয়ের নাম (mathematics, physics, politics, gymnastics ইত্যাদি) সাধারণত singular verb গ্রহণ করে।","pg":110,"q":true},{"n":534,"title":"Money + singular verb","dont":["All her money are kept in the bank."],"say":["All her money is kept in the bank."],"note":"Note: Money একটি singular (uncountable) noun এবং সর্বদা singular verb ও pronoun গ্রহণ করে।","pg":110,"q":true},{"n":535,"title":"News + singular verb","dont":["I'm glad that the news are good."],"say":["I'm glad that the news is good."],"note":"Note: News দেখতে plural হলেও সর্বদা singular verb গ্রহণ করে। একটি মাত্র সংবাদ বোঝাতে বলুন: a piece বা an item of news, যেমন: This is a good piece of news.","pg":110,"q":true},{"n":536,"title":"Scissors ইত্যাদি + plural verb","dont":["The scissor is lying on the table."],"say":["The scissors are lying on the table."],"note":"Note: দুটি অংশ বিশিষ্ট noun (scissors, trousers, spectacles, shears, pliers ইত্যাদি) plural verb গ্রহণ করে। তবে a pair of (scissors, etc.)-এর পরে singular verb বসে: A pair of scissors is ...","pg":110,"q":true},{"n":537,"title":"People + plural verb","dont":["There is lots of people in the cinema."],"say":["There are lots of people in the cinema."],"note":"Note: People যখন জাতি অর্থে ব্যবহৃত হয় তখন এটি singular, এবং এর plural রূপ peoples, যেমন: The Greeks are a brave people; The peoples of Europe are often engaged in war.","pg":110,"q":true},{"n":538,"title":"Clothes + plural verb","dont":["Your cloth is very fashionable."],"say":["Your clothes are very fashionable."],"note":"Note: Cloth অর্থ কাপড় (যে উপাদান থেকে পোশাক তৈরি হয়); এর plural রূপ cloths (e ছাড়া), যেমন: She cleaned the table with a cloth; Merchants sell different kinds of cloths.","pg":111,"q":true},{"n":539,"title":"Riches + plural verb","dont":["All her riches was stolen."],"say":["All her riches were stolen."],"note":"Note: Riches হল একটি plural noun এবং সর্বদা plural verb গ্রহণ করে","pg":111,"q":true},{"n":540,"title":"Wages + plural verb","dont":["Keith complains that his wage is low."],"say":["Keith complains that his wages are low."],"note":"Note: Wages একটি plural noun এবং সাধারণত plural verb গ্রহণ করে; তবে আমরা বলি a living wage।\nসতর্কতা: আধুনিক ইংরেজিতে “Keith complains that his wage is low.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":111,"q":false},{"n":541,"title":"Billiards","dont":["Billiard is a very difficult game."],"say":["Billiards is a very difficult game."],"note":"Note: Billiards, draughts, darts দেখতে plural হলেও (খেলার নাম হিসেবে) এদের পরে singular verb বসে।","pg":111,"q":true},{"n":542,"title":"Adjective-কে plural রূপ দেওয়া জনিত ভুল:","dont":["The rich have a duty to help the poors."],"say":["The rich have a duty to help the poor."],"note":"Note: Adjective-কে plural অর্থে noun হিসেবে ব্যবহার করলেও এর শেষে -s যুক্ত হয় না।","pg":111,"q":true},{"n":543,"title":"As well as-এর সাথে plural verb-এর অপব্যবহার:","dont":["Tom as well as Mark are coming."],"say":["Tom as well as Mark is coming."],"note":"Singular noun as well as দ্বারা যুক্ত হলে verb প্রথম noun-এর সাথে মিল রেখে singular হয়।","pg":111,"q":true},{"n":544,"title":"All (= everything)-এর সাথে plural verb-এর অপব্যবহার:","dont":["Nothing's left; all are lost."],"say":["Nothing's left; all is lost."],"note":"All যখন সবকিছু (everything) অর্থে ব্যবহৃত হয়, তখন singular verb গ্রহণ করে; all যখন সকলে (everybody) অর্থে ব্যবহৃত হয়, তখন plural verb গ্রহণ করে, যেমন: All of us are present.","pg":111,"q":true},{"n":545,"title":"Kind বা sort-এর পূর্বে plural-এর অপব্যবহার:","dont":["I don’t like these kind of games."],"say":["I don’t like this kind of game."],"note":"Or: I don’t like games of this kind.\nNote: Demonstrative শব্দ (this / that ইত্যাদি) অবশ্যই তার noun-এর সাথে number-এ মিল রাখবে। উদাহরণে kind singular, সুতরাং this ব্যবহৃত হবে।","pg":112,"q":true},{"n":546,"title":"ভাষা (Language)-এর নামের সাথে Plural (verb)-এর অপব্যবহার","dont":["English are easier than German."],"say":["English is easier than German."],"note":"ভাষার নাম singular এবং সর্বদা singular verb গ্রহণ করে।","pg":112,"q":true},{"n":547,"title":"One-এর চেয়ে বেশি সংখ্যার সাথে singular-এর অপব্যবহার:","dont":["I read it in one and a half hour."],"say":["I read it in one and a half hours."],"note":"ইংরেজিতে one-এর চেয়ে বড় যে কোনো সংখ্যার সাথে plural noun ব্যবহৃত হয়, সংখ্যাটি two-এর চেয়ে ছোট হলেও।","pg":112,"q":true},{"n":548,"title":"Collective noun-এর plural অর্থে singular verb-এর অপব্যবহার:","dont":["The class was divided in its opinion."],"say":["The class were divided in their opinions."],"note":"একটি collective noun সাধারণত singular verb গ্রহণ করে। তবে যখন এটি দলের সদস্যদের আলাদা আলাদাভাবে বোঝায় এবং দলটিকে অবিভক্ত একক হিসেবে বিবেচনা করা হয় না, তখন plural verb ব্যবহৃত হয়।\nসতর্কতা: আধুনিক ইংরেজিতে “The class was divided in its opinion.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":112,"q":false},{"n":549,"title":"The number এবং A number","dont":["The number of pupils are increasing.","A number of pupils is absent today."],"say":["The number of pupils is increasing.","A number of pupils are absent today."],"note":"Number-এর পূর্বে the থাকলে এটি একটি একক সংখ্যা বোঝায় এবং singular verb নেয়; number-এর পূর্বে a থাকলে এটি ‘কিছু সংখ্যক / অনেক’ অর্থ দেয় এবং plural verb নেয়।","pg":112,"q":true},{"n":550,"title":"These-এর পরিবর্তে this-এর অপব্যবহার:","dont":["This books are mine."],"say":["These books are mine."],"note":"Plural noun-এর পূর্বে this-এর plural রূপ these ব্যবহৃত হয়।\nNote: Personal pronoun-এর পরিবর্তে this ব্যবহারও এড়িয়ে চলুন: John had the book but he gave this to his brother না বলে বলুন John had the book but he gave it to his brother.","pg":112,"q":true},{"n":551,"title":"There are-এর পরিবর্তে there is-এর অপব্যবহার:","dont":["There is many people in the room."],"say":["There are many people in the room."],"note":"There is-এর পরের noun plural হলে there are ব্যবহৃত হয়।","pg":112,"q":true},{"n":552,"title":"You were-এর পরিবর্তে you was-এর অপব্যবহার:","dont":["You was very foolish to do that."],"say":["You were very foolish to do that."],"note":"Was singular এবং were plural; তবে you pronoun-এর সাথে আমরা সর্বদা were ব্যবহার করি, অর্থ singular হলেও।\nNote: শর্ত বা ইচ্ছা প্রকাশে singular subject-এর সাথেও were ব্যবহৃত হতে পারে, যেমন: If I were you, I’d go; I wish I were rich.","pg":113,"q":true},{"n":553,"title":"Lives ইত্যাদির পরিবর্তে life ইত্যাদির অপব্যবহার:","dont":["Many people lost their life at sea."],"say":["Many people lost their lives at sea."],"note":"Life, heart, soul, body, mind-এর মতো noun যখন একাধিক ব্যক্তিকে নির্দেশ করে, তখন এরা plural রূপে ব্যবহৃত হয়।","pg":113,"q":true},{"n":554,"title":"Noun এবং verb-এর number-এ অমিল (Agreement of number):","dont":["A large supply of toys are expected."],"say":["A large supply of toys is expected."],"note":"Subject singular হলে verb অবশ্যই singular হবে এবং subject plural হলে verb অবশ্যই plural হবে। Singular subject এবং verb-এর মাঝে কোনো plural noun বসলে বিশেষ সতর্কতা অবলম্বন করতে হবে।","pg":113,"q":true},{"n":555,"title":"As এবং Like.","dont":["You do not play the game like I do.","You don’t look as your mother."],"say":["You do not play the game as I do.","You don’t look like your mother."],"note":"As একটি conjunction, এর পরে সাধারণত subject ও verb সহ একটি clause বসে। Like conjunction নয়; এটি preposition-এর মতো আচরণ করে এবং এর পরে objective case-এর একটি noun বা pronoun বসে।","pg":114,"q":true},{"n":556,"title":"So এবং Such","dont":["It's such small that you can't see it.","I've never seen a so large animal before."],"say":["It's so small that you can't see it.","I've never seen such a large animal before."],"note":"So একটি adverb এবং এটি অবশ্যই কোনো adjective বা অন্য একটি adverb-কে বিশেষিত করবে। Such একটি adjective এবং এটি অবশ্যই একটি noun-কে বিশেষিত করবে।","pg":114,"q":true},{"n":558,"title":"Fool এবং Foolish","dont":["Anne said to me, ‘You're fool.’","Anne said to me, ‘You're a foolish.’"],"say":["Anne said to me, ‘You're a fool.’","Anne said to me, ‘You're foolish.’"],"note":"Fool একটি noun; to be verb-এর সাথে ব্যবহৃত হলে এর পূর্বে article প্রয়োজন হয়। Foolish একটি adjective; to be verb-এর পরে এর সাথে article ব্যবহৃত হয় না।\nNote: A fool বা a foolish person অর্থ ‘পাগল’ নয়, বরং এমন ব্যক্তি যে বোকার মতো বা অবিবেচকের মতো কাজ করে।","pg":116,"q":true},{"n":559,"title":"Preposition হিসেবে due to-এর অপব্যবহার:","dont":["William came late due to an accident."],"say":["William came late because of an accident."],"note":"প্রথাগত ব্যাকরণ মতে because of বা owing to (‘কারণে / দরুন’) অর্থে due to preposition হিসেবে ব্যবহার করা উচিত নয়। Due adjective হিসেবে সঠিকভাবে ব্যবহৃত হয় যখন এটি কোনো noun-কে বিশেষিত করে, যেমন: His delay was due to an accident.\nসতর্কতা: আধুনিক ইংরেজিতে “William came late due to an accident.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":116,"q":false},{"n":560,"title":"Adjective হিসেবে rest-এর অপব্যবহার (misuse)","dont":["I spent the rest day at home."],"say":["I spent the rest of the day at home."],"note":"এখানে rest একটি noun (অবশিষ্টাংশ) এবং এটি adjective হিসেবে ব্যবহৃত হতে পারে না।","pg":116,"q":true},{"n":561,"title":"Adjective হিসেবে miser-এর অপব্যবহার (misuse)","dont":["Jill loved money; she was miser."],"say":["Jill loved money; she was a miser."],"note":"Miser হল- একটি noun এবং adjective হিসেবে ব্যবহৃত হতে পারে না। এর adjective হল miserly, যেমন: He was miserly.","pg":116,"q":true},{"n":562,"title":"Adjective হিসেবে opened-এর অপব্যবহার (misuse)","dont":["I found all the windows opened."],"say":["I found all the windows open."],"note":"অবস্থা বোঝাতে adjective open ব্যবহৃত হয়। Opened হল open verb-এর past participle, যা কাজ বোঝায়, যেমন: Somebody has opened all the windows.","pg":116,"q":true},{"n":563,"title":"Adverb হিসেবে friendly-এর অপব্যবহার (misuse)","dont":["Andrew behaves friendly."],"say":["Andrew behaves in a friendly way."],"note":"Adverbial phrase-টি হল in a friendly way। Friendly একটি adjective, যেমন: a friendly game, to have friendly relations with one’s neighbours ইত্যাদি।","pg":117,"q":true},{"n":564,"title":"Adjective হিসেবে truth-এর অপব্যবহার (misuse)","dont":["Is it truth that Diana's very ill?"],"say":["Is it true that Diana’s very ill?"],"note":"Truth একটি noun, adjective নয়। Adjective হল true, এবং to be verb-এর পরে এর পূর্বে কোনো article বসে না।","pg":117,"q":true},{"n":565,"title":"Adjective হিসেবে plenty-এর অপব্যবহার (misuse)","dont":["Mike had plenty work to do."],"say":["Mike had plenty of work to do."],"note":"Plenty একটি noun (প্রচুর সংখ্যা বা পরিমাণ), adjective নয়; তাই plenty of বলতে হয়। Adjective-টি হল plentiful, যেমন: Oranges are cheap now because they are plentiful.","pg":117,"q":true},{"n":566,"title":"Adjective হিসেবে coward-এর অপব্যবহার (misuse)","dont":["She said, ‘You are a coward boy.’"],"say":["She said, ‘You are a coward.’"],"note":"Coward (ভীরু ব্যক্তি) একটি noun; adjective-টি হল cowardly।","pg":117,"q":true},{"n":567,"title":"Adjective হিসেবে other-এর অপব্যবহার (misuse)","dont":["The others boys aren't here."],"say":["The other boys aren't here."],"note":"Note: Others একটি pronoun, adjective নয়। Adjective হল other (s ছাড়া)। তবে boys noun-টি বাদ দিয়ে বলা যায়: The others aren't here.","pg":117,"q":true},{"n":568,"title":"Dead-এর পরিবর্তে died-এর অপব্যবহার (misuse)","dont":["I think his grandfather is died."],"say":["I think his grandfather is dead."],"note":"Died হল die-এর past tense; adjective হল dead।","pg":117,"q":true},{"n":570,"title":"Its-এর পরিবর্তে it’s-এর অপব্যবহার (misuse)","dont":["The bird was feeding it’s young."],"say":["The bird was feeding its young."],"note":"Possessive adjective its-এ apostrophe বসে না (it’s = it is)। Hers, ours, yours, theirs — এরাও কোনো apostrophe গ্রহণ করে না।","pg":118,"q":true},{"n":571,"title":"Noun হিসেবে hot-এর অপব্যবহার (misuse)","dont":["There's much hot this summer."],"say":["It’s very hot this summer."],"note":"Hot একটি adjective এবং এটি noun হিসেবে ব্যবহৃত হয় না; noun হল heat।","pg":118,"q":true},{"n":575,"title":"Verb হিসেবে afraid-এর অপব্যবহার (misuse)","dont":["John doesn’t afraid of anybody."],"say":["John’s not afraid of anybody."],"note":"Afraid একটি verb নয়, বরং adjective; এটি to be verb-এর সাথে ব্যবহৃত হয়।","pg":118,"q":true},{"n":576,"title":"Verb হিসেবে weight-এর অপব্যবহার (misuse)","dont":["Have you weighted the letter?"],"say":["Have you weighed the letter?"],"note":"Weight একটি noun এবং verb হিসেবে ব্যবহৃত হয় না; verb হল weigh (t ছাড়া)।","pg":119,"q":true},{"n":577,"title":"Well-এর পরিবর্তে good-এর অপব্যবহার (misuse)","dont":["The goalkeeper plays very good."],"say":["The goalkeeper plays very well."],"note":"Good কেবল adjective এবং adverb হিসেবে ব্যবহৃত হতে পারে না; adverb হল well।","pg":119,"q":true},{"n":578,"title":"adverb-এর পরিবর্তে adjective-এর অপব্যবহার (misuse)","dont":["The little girl sang beautiful."],"say":["The little girl sang beautifully."],"note":"Verb-কে বিশেষিত করতে আমরা adverb ব্যবহার করি, adjective নয়।\nNote: তবে look, feel, sound, taste, smell-এর মতো verb-এর পরে adverb-এর পরিবর্তে adjective বসে: Sugar tastes sweet (sweetly নয়)।","pg":119,"q":true},{"n":579,"title":"Afterwards ইত্যাদির পরিবর্তে after-এর অপব্যবহার (misuse)","dont":["After we went home for dinner."],"say":["Afterwards we went home for dinner."],"note":"After একটি preposition (বা conjunction) এবং এর পরে একটি object (বা clause) বসে। Afterwards, then, after const TOEFL=[{"id":"1-1","t":1,"n":1,"type":"error","ans":"A","fix":"are → is","en":"The subject is the gerund phrase ‘Buying clothes’, which is singular, so the verb must be ‘is’.","bn":"বাক্যের subject হলো gerund phrase ‘Buying clothes’। Gerund subject সবসময় singular, তাই verb হবে ‘is’, ‘are’ নয়।","parts":["Buying clothes",{"k":"A","t":"are"},"often",{"k":"B","t":"a very time-consuming"},"practice",{"k":"C","t":"because those"},"clothes that a person likes",{"k":"D","t":"are rarely the ones"},"that fit him or her."]},{"id":"1-2","t":1,"n":2,"type":"error","ans":"B","fix":"too many → too much","en":"‘Time’ (meaning a period of time) is uncountable, so it takes ‘much’, not ‘many’.","bn":"‘Time’ এখানে অগণনযোগ্য (uncountable) noun, তাই ‘many’ নয়, ‘much’ বসবে।","parts":[{"k":"A","t":"Because"},"they had spent",{"k":"B","t":"too many"},"time",{"k":"C","t":"considering"},"the new contract, the students",{"k":"D","t":"lost the opportunity"},"to lease the apartment."]},{"id":"1-3","t":1,"n":3,"type":"error","ans":"C","fix":"we to buy → us to buy","en":"After the preposition ‘for’, a pronoun must be in its object form: ‘for us to buy’.","bn":"Preposition ‘for’-এর পরে pronoun-এর object form বসে, তাই ‘we’ নয়, ‘us’ হবে।","parts":[{"k":"A","t":"These"},"televisions",{"k":"B","t":"are all too expensive"},"for",{"k":"C","t":"we to buy"},"at",{"k":"D","t":"this time"},", but perhaps we will return later."]},{"id":"1-4","t":1,"n":4,"type":"error","ans":"B","fix":"himself → herself","en":"The reflexive pronoun must agree with the subject ‘she’.","bn":"Subject ‘she’ (স্ত্রীলিঙ্গ), তাই reflexive pronoun হবে ‘herself’।","parts":["After she",{"k":"A","t":"had bought"},{"k":"B","t":"himself"},"a new automobile,",{"k":"C","t":"she sold"},{"k":"D","t":"her"},"bicycle."]},{"id":"1-5","t":1,"n":5,"type":"error","ans":"C","fix":"do we have to → we have to","en":"This is an embedded (indirect) question, so it uses statement word order — question word + subject + verb — without ‘do’.","bn": ould be in the simple past: ‘he read a book’.","bn":"‘had returned’ (past perfect) আগের কাজ বোঝায়; এর পরের সম্পূর্ণ কাজটি simple past হবে: ‘he read a book’।","parts":["After George",{"k":"A","t":"had returned"},{"k":"B","t":"to his house"},",",{"k":"C","t":"he"},{"k":"D","t":"was reading"},"a book."]},{"id":"1-10","t":1,"n":10,"type":"error","ans":"B","fix":"has been → have been","en":"The subject ‘Many theories’ is plural, so the verb must be ‘have been’.","bn":"Subject ‘Many theories’ plural, তাই ‘has been’ নয়, ‘have been’ হবে।","parts":[{"k":"A","t":"Many"},"theories on conserving the purity of water",{"k":"B","t":"has been"},"proposed but",{"k":"C","t":"not one has"},"been",{"k":"D","t":"as widely accepted"},"as this one."]},{"id":"1-11","t":1,"n":11,"type":"error","ans":"C","fix":"is smelling → smells","en":"Here ‘smell’ is a linking (state) verb, and such verbs are not normally used in the continuous form.","bn":"এখানে ‘smell’ অবস্থা-নির্দেশক linking verb; এ ধরনের verb সাধারণত continuous (-ing) রূপে বসে না, তাই ‘smells’ হবে।","parts":[{"k":"A","t":"The food"},"that Mark",{"k":"B","t":"is cooking"},"in the kitchen",{"k":"C","t":"is smelling"},{"k":"D","t":"delicious"},"."]},{"id":"1-12","t":1,"n":12,"type":"error","ans":"A","fix":"eaten → had eaten","en":"A past participle cannot stand alone as the verb. The earlier past action needs the past perfect: ‘had eaten’.","bn":"Past participle ‘eaten’ একা verb হিসেবে বসতে পারে না। আগের কাজ বোঝাতে past perfect ‘had eaten’ হবে।","parts":["After John",{"k":"A","t":"eaten"},"dinner,",{"k":"B","t":"he wrote"},{"k":"C","t":"several letters"},"and",{"k":"D","t":"went to bed"},"."]},{"id":"1-13","t":1,"n":13,"type":"error","ans":"A","fix":"has finished → finished","en":"‘Last night’ is a finished past time, so use the simple past, not the present perfect.","bn":"‘Last night’ নির্দিষ্ট অতীত সময় নির্দেশ করে, তাই present perfect নয়, simple past ‘finished’ হবে।","parts":["The manager",{"k":"A","t":"has finished"},{"k":"B","t" ":42,"type":"error","ans":"C","fix":"laying → lying","en":"The jacket was resting there (no object), so use ‘lie’: ‘had been lying’.","bn":"জ্যাকেটটি পড়ে ছিল (object নেই), তাই ‘lie’-এর -ing রূপ ‘lying’ হবে।","parts":["After Allan",{"k":"A","t":"had searched"},{"k":"B","t":"for"},"twenty minutes, he realized that his jacket had been",{"k":"C","t":"laying"},"on the table",{"k":"D","t":"the entire time"},"."]},{"id":"3-43","t":3,"n":43,"type":"error","ans":"A","fix":"discovered → were discovered","en":"The problems were found by someone, so the passive is needed: ‘that were discovered’.","bn":"সমস্যাগুলো কেউ খুঁজে পেয়েছে, তাই passive লাগবে: ‘that were discovered’।","parts":["The problems that",{"k":"A","t":"discovered"},{"k":"B","t":"since"},"the initial research",{"k":"C","t":"had been completed"},"caused the committee members",{"k":"D","t":"to table"},"the proposal temporarily."]},{"id":"3-44","t":3,"n":44,"type":"error","ans":"A","fix":"lay → lie","en":"The meaning is ‘rest in bed’ (intransitive), so the subjunctive base form is ‘lie’: ‘suggested that he lie in bed’.","bn":"বিছানায় বিশ্রাম নেওয়া অর্থে intransitive ‘lie’; ‘suggested that’-এর পরে subjunctive মূল রূপ ‘lie’ বসে।","parts":["The doctor suggested that he",{"k":"A","t":"lay"},{"k":"B","t":"in bed"},"for",{"k":"C","t":"several"},"days as a precaution against",{"k":"D","t":"further damage"},"to the tendons."],"note":"PDF-এ এই প্রশ্নের নিচে অন্য প্রশ্নের ব্যাখ্যা ও উত্তর (D) বসে গিয়েছিল। সঠিক উত্তর (A): lay → lie।"},{"id":"3-46","t":3,"n":46,"type":"error","ans":"A","fix":"stated he → stated that he","en":"In formal written English, ‘state’ should introduce its noun clause with ‘that’.","bn":"আনুষ্ঠানিক লিখিত ইংরেজিতে ‘state’-এর পরে noun clause শুরু করতে ‘that’ বসানো উচিত।","parts":["The project director",{"k":"A","t":"stated he"},"believed",{"k":"B","t":"it was necessary"},{"k":"C","t":"to study"},"the proposals for several more months",{"k":"D","t":"before making a decision"},"."]},{"id":"3-47","t":3,"n
